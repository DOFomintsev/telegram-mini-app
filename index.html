<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Deal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#000000;
  --card1:#1DB954;
  --card2:#16a34a;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  color:#fff;
  overflow-x:hidden;
  padding-bottom:90px;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  pointer-events:none;
}

h1{
  text-align:center;
  padding:24px 0 10px;
  font-size:22px;
  font-weight:700;
  opacity:0;
  transform:translateY(-20px);
  animation:titleAppear .8s ease forwards;
}

@keyframes titleAppear{
  to{opacity:1;transform:translateY(0);}
}

/* ===== Категории ===== */

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:20px;
}

.category-card{
  background:linear-gradient(135deg,var(--card1),var(--card2));
  border-radius:24px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 12px 35px rgba(29,185,84,0.35);
  cursor:pointer;
  position:relative;
  overflow:hidden;
  opacity:0;
  transform:translateY(50px) scale(.9);
  filter:blur(14px);
}

.category-card.show{
  animation:ultraAppear 1s cubic-bezier(.22,1,.36,1) forwards;
}

@keyframes ultraAppear{
  0%{opacity:0;transform:translateY(50px) scale(.9);filter:blur(14px);}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
}

.category-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top left, rgba(255,255,255,.18), transparent 60%);
  opacity:.6;
}

.icon{
  margin-bottom:14px;
}

.icon svg{
  width:46px;
  height:46px;
  stroke:rgba(255,255,255,0.95);
  fill:rgba(255,255,255,0.08);
  stroke-width:1.8;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.35));
}

.label{
  font-size:15px;
  font-weight:600;
}

/* ===== Цены ===== */

.prices{
  display:none;
  padding:20px;
}

.price-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

  background:linear-gradient(145deg,#121212,#1c1c1c);
  border:1px solid rgba(255,255,255,.06);
  color:#fff;
  padding:18px 20px;
  margin-bottom:16px;
  border-radius:20px;
  font-size:15px;
  font-weight:600;
  letter-spacing:.3px;
  cursor:pointer;
  position:relative;
  overflow:hidden;

  opacity:0;
  transform:translateY(15px);
  transition:all .35s cubic-bezier(.22,1,.36,1);

  box-shadow:
    0 8px 25px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.05);
}

/* левая часть */
.price-left{
  display:flex;
  align-items:center;
  gap:12px;
}

/* иконка */
.price-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(29,185,84,.12);
  color:#1DB954;
  font-size:16px;
}

/* стрелка */
.price-arrow{
  font-size:18px;
  opacity:.4;
  transition:.3s;
}

/* glow эффект */
.price-btn:hover{
  transform:translateY(-4px);
  border-color:rgba(29,185,84,.5);
  box-shadow:
    0 15px 40px rgba(29,185,84,.25),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.price-btn:hover .price-arrow{
  opacity:1;
  transform:translateX(6px);
}

/* анимация нажатия */
.price-btn:active{
  transform:scale(.97);
}

.back-btn{
  text-align:center;
  font-size:14px;
  opacity:.6;
  margin-top:6px;
  cursor:pointer;
}

/* ===== Bottom Actions ===== */

.bottom-actions{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%) translateY(30px);
  width:90%;
  max-width:420px;
  display:flex;
  gap:12px;
  opacity:0;
  transition:.6s cubic-bezier(.22,1,.36,1);
}

.bottom-actions.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.action-btn{
  flex:1;
  padding:12px 14px;
  font-size:14px;
  font-weight:600;
  border-radius:16px;
  cursor:pointer;
  border:none;
  color:#fff;

  background:linear-gradient(135deg,var(--card1),var(--card2));
  box-shadow:0 10px 30px rgba(29,185,84,.35);
  transition:.3s ease;
}

.action-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 40px rgba(29,185,84,.45);
}

.action-btn:active{
  transform:scale(.96);
}

/* Стиль кнопок "Обратная связь" и "Сайт" */
  
.action-btn{
  flex:1;
  padding:13px 16px;
  font-size:14px;
  font-weight:600;
  border-radius:18px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
  color:#fff;

  background:linear-gradient(145deg,#121212,#1c1c1c);
  box-shadow:
    0 8px 25px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.05);

  transition:all .35s cubic-bezier(.22,1,.36,1);
  position:relative;
  overflow:hidden;
}

/* hover glow */
.action-btn:hover{
  transform:translateY(-3px);
  border-color:rgba(29,185,84,.4);
  box-shadow:
    0 15px 40px rgba(29,185,84,.25),
    inset 0 1px 0 rgba(255,255,255,.08);
}

/* press */
.action-btn:active{
  transform:scale(.96);
}

/* ===== Admin ===== */

.admin-btn{
  position:fixed;
  top:18px;
  right:18px;
  background:#111;
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
}

.admin-panel{
  position:fixed;
  inset:0;
  background:#000;
  padding:25px;
  overflow-y:auto;
  display:none;
  z-index:999;
}

.admin-card{
  background:#111;
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,.08);
}

 /* ===== iOS Swipe Back ===== */

.swipeable{
  transition: transform .25s ease;
  will-change: transform;
} 

/* ===== Engraved Gold Signature ===== */

.signature-wrapper{
  width:100%;
  text-align:center;
  margin-bottom:14px;
  opacity:0;
  transform:translateY(8px);
  transition:.8s cubic-bezier(.22,1,.36,1);
}

.bottom-actions.show .signature-wrapper{
  opacity:1;
  transform:translateY(0);
}

/* базовая "золото" */
.signature{
  font-size:12px;
  letter-spacing:.8px;
  font-family:"Brush Script MT","Segoe Script",cursive;
  position:relative;
  display:inline-block;

  background:linear-gradient(
    110deg,
    #6f5416 0%,
    #caa132 22%,
    #f6e27a 45%,
    #fff3b0 50%,
    #f6e27a 55%,
    #caa132 78%,
    #6f5416 100%
  );
  background-size:220% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* гравировка: "вдавленный" эффект */
.signature.engraved{
  /* темная внутренняя тень + светлый кант */
  text-shadow:
    0 1px 0 rgba(255,255,255,.14),     /* верхний подсвет */
    0 -1px 0 rgba(0,0,0,.55),          /* нижний контур */
    0 2px 4px rgba(0,0,0,.55);         /* глубина */

  filter:contrast(1.08) saturate(1.1);
}

/* тончайший micro-specular блик "по гравировке" */
.signature.engraved::after{
  content:"";
  position:absolute;
  inset:-2px -10px;
  pointer-events:none;

  background:linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,.10) 35%,
    rgba(255,255,255,.22) 50%,
    rgba(255,255,255,.10) 65%,
    transparent 100%
  );

  mix-blend-mode:screen;
  opacity:.55;
  transform:translateX(-60%);
  animation:engravedSheen 7s ease-in-out infinite;
  border-radius:999px;
}

@keyframes engravedSheen{
  0%   { transform:translateX(-70%); opacity:.25; }
  40%  { opacity:.55; }
  60%  { opacity:.55; }
  100% { transform:translateX(70%); opacity:.25; }
}

/* тонкая линия */
.signature-line{
  margin:6px auto 0;
  width:128px;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(246,226,122,.85),
    rgba(202,161,50,.9),
    rgba(246,226,122,.85),
    transparent
  );
  box-shadow:
    0 0 10px rgba(212,175,55,.22),
    0 1px 0 rgba(255,255,255,.06);
  opacity:.75;
}
</style>
</head>

<body>

<h1>Smart Deal</h1>

<div id="swipeContainer" class="swipeable">
  <div class="categories" id="categories"></div>
  <div class="prices" id="prices"></div>
</div>
  
<div class="bottom-actions" id="bottomActions">
  
<div class="signature-wrapper">
  <div class="signature engraved">
    The idea is developed — Fomintsev Denis
  </div>
  <div class="signature-line"></div>
</div>
  
  <button class="action-btn" onclick="openFeedback()">
    💬 Обратная связь
  </button>

  <button class="action-btn outline" onclick="openSite()">
    🌐 Зайти на сайт
  </button>

</div>

<button id="adminBtn" class="admin-btn" style="display:none;">⚙</button>
<div id="adminPanel" class="admin-panel"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const ADMIN_ID = 929524875;

/* ===== SERVER ANALYTICS ===== */

const ANALYTICS_URL = "https://script.google.com/macros/s/AKfycbxcIbUNFvrbt1BMSTPsAt6X7WBf44PXaDoSBu8x5PyqkwndQZVa2w2180AYaYQrRx7y/exec";

function sendAnalytics(data){
  fetch(ANALYTICS_URL,{
    method:"POST",
    body:JSON.stringify(data)
  }).catch(()=>{});
}

const user = tg.initDataUnsafe?.user;
const isAdmin = user && user.id === ADMIN_ID;

if(isAdmin){
  document.getElementById("adminBtn").style.display="block";
}

function haptic(type="light"){
  if(tg.HapticFeedback){
    tg.HapticFeedback.impactOccurred(type);
  }
}

function openFeedback(){
  haptic("medium");
  tg.openTelegramLink("https://t.me/DFomintsev");
}

function openSite(){
  haptic("medium");
  tg.openLink("https://niceprice.pro");
}
  
/* ===== СТАТИСТИКА ===== */

let stats = JSON.parse(localStorage.getItem("smartDealStats")) || {
  launches:0,
  users:[],
  categories:{},
  products:{}
};

stats.launches++;
sendAnalytics({
  user_id: user?.id || 0,
  username: user?.username || "",
  action: "launch"
});
if(user && !stats.users.includes(user.id)){
  stats.users.push(user.id);
}
localStorage.setItem("smartDealStats", JSON.stringify(stats));

/* ===== Google Sheets ===== */

const SHEET_URL="https://docs.google.com/spreadsheets/d/1-JYl4b-6H_iWvBS2Zsez1K1DPx35iBUCCPPRiSrVY7o/export?format=csv";
let data={};

async function loadData(){
  const response=await fetch(SHEET_URL);
  const text=await response.text();
  const rows=text.split("\n").slice(1);

  rows.forEach(row=>{
    const [category,price,link]=row.split(",");
    if(!data[category]) data[category]=[];
    data[category].push({price,link});
  });

  renderCategories();
  setTimeout(()=>{
  document.getElementById("bottomActions").classList.add("show");
}, 700);  
}

/* ===== Иконки ===== */

function getIcon(category){
  if(category==="Смартфоны"){
    return `<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>`;
  }
  if(category==="Ноутбуки"){
    return `<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="10" rx="2"/><line x1="2" y1="17" x2="22" y2="17"/></svg>`;
  }
  if(category==="Планшеты"){
    return `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="17" r="0.7"/></svg>`;
  }
  if(category==="Телевизоры"){
    return `<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;
  }
  return "";
}

/* ===== Категории ===== */

function renderCategories(){
  const container=document.getElementById("categories");
  container.innerHTML="";
  container.style.display="grid";

  Object.keys(data).forEach((category,index)=>{
    const div=document.createElement("div");
    div.className="category-card";

    div.innerHTML=`
      <div class="icon">${getIcon(category)}</div>
      <div class="label">${category}</div>
    `;

    div.onclick=()=>{
      if(!stats.categories[category]) stats.categories[category]=0;
      stats.categories[category]++;
      sendAnalytics({
  user_id: user?.id || 0,
  username: user?.username || "",
  action: "category_click",
  category: category
});
      localStorage.setItem("smartDealStats", JSON.stringify(stats));
      showPrices(category);
    };

    container.appendChild(div);
    setTimeout(()=>div.classList.add("show"), index*140);
  });
}

/* ===== Цены ===== */

function showPrices(category){
  const categoriesBlock=document.getElementById("categories");
  const pricesDiv=document.getElementById("prices");

  haptic("medium");
  categoriesBlock.style.display="none";
  pricesDiv.style.display="block";
  pricesDiv.innerHTML="";

  data[category].forEach((item,index)=>{
    const btn=document.createElement("button");
    btn.className="price-btn";
    btn.innerHTML = `
  <div class="price-left">
    <div class="price-icon">💰</div>
    <div>${item.price}</div>
  </div>
  <div class="price-arrow">→</div>
`;

    btn.onclick=()=>{
      const key=category+" | "+item.price;
      if(!stats.products[key]) stats.products[key]=0;
      stats.products[key]++;
      sendAnalytics({
  user_id: user?.id || 0,
  username: user?.username || "",
  action: "product_click",
  category: category,
  product: item.price,
  price: item.price
});
      localStorage.setItem("smartDealStats", JSON.stringify(stats));
      tg.openLink(item.link);
    };

    pricesDiv.appendChild(btn);

    setTimeout(()=>{
      btn.style.opacity="1";
      btn.style.transform="translateY(0)";
    },index*80);
  });

  const back=document.createElement("div");
  back.className="back-btn";
  back.innerText="← Назад";
  back.onclick=()=>{
    pricesDiv.style.display="none";
    categoriesBlock.style.display="grid";
    renderCategories();
  };

  pricesDiv.appendChild(back);
}

/* ===== ADMIN SERVER VERSION ===== */

document.getElementById("adminBtn").onclick = async () => {

  const panel = document.getElementById("adminPanel");
  panel.style.display = "block";
  panel.innerHTML = "Загрузка...";

  try{
    const response = await fetch(ANALYTICS_URL);
    const s = await response.json();

    const conversion = s.launches > 0
      ? ((s.product_clicks / s.launches) * 100).toFixed(1)
      : 0;

    panel.innerHTML = `
      <h2 style="margin-bottom:20px;">📊 Smart Deal Admin 3.0</h2>

      <div class="admin-card">🚀 Всего запусков: <b>${s.launches}</b></div>
      <div class="admin-card">👤 Всего пользователей: <b>${s.unique_users}</b></div>
      <div class="admin-card">🛒 Всего кликов: <b>${s.product_clicks}</b></div>
      <div class="admin-card">📈 Общая конверсия: <b>${conversion}%</b></div>

      <h3 style="margin-top:25px;">📅 Сегодня</h3>
      <div class="admin-card">🚀 Запусков сегодня: <b>${s.today_launches}</b></div>
      <div class="admin-card">👤 Новых сегодня: <b>${s.today_users}</b></div>
      <div class="admin-card">🛒 Кликов сегодня: <b>${s.today_product_clicks}</b></div>

      <h3 style="margin-top:25px;">🔥 Топ категории</h3>
      ${renderTop(s.top_categories)}

      <h3 style="margin-top:25px;">💰 Топ товары</h3>
      ${renderTop(s.top_products)}

      <br>
      <button onclick="closeAdmin()">Закрыть</button>
    `;

  } catch(e){
    panel.innerHTML = "Ошибка загрузки данных";
  }
};

function renderTop(obj){
  if(!obj || Object.keys(obj).length === 0){
    return '<div class="admin-card">Нет данных</div>';
  }

  const total = Object.values(obj).reduce((a,b)=>a+b,0);

  return Object.entries(obj)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3)
    .map((item,i)=>{
      const percent = ((item[1] / total) * 100).toFixed(1);
      return `
        <div class="admin-card">
          ${i+1}. ${item[0]}<br>
          <small>${item[1]} кликов (${percent}%)</small>
        </div>
      `;
    })
    .join("");
}

function closeAdmin(){
  document.getElementById("adminPanel").style.display="none";
}

/* ===== SWIPE BACK SYSTEM ===== */

let startX = 0;
let currentX = 0;
let isSwiping = false;
const swipeZone = 40; // зона от левого края
const threshold = 90; // сколько нужно провести

const swipeContainer = document.getElementById("swipeContainer");

swipeContainer.addEventListener("touchstart", e => {
  if(document.getElementById("prices").style.display !== "block") return;

  if(e.touches[0].clientX < swipeZone){
    isSwiping = true;
    startX = e.touches[0].clientX;
  }
});

swipeContainer.addEventListener("touchmove", e => {
  if(!isSwiping) return;

  currentX = e.touches[0].clientX;
  let diff = currentX - startX;

  if(diff > 0){
    swipeContainer.style.transform = `translateX(${diff}px)`;
  }
});

swipeContainer.addEventListener("touchend", () => {
  if(!isSwiping) return;

  let diff = currentX - startX;

  if(diff > threshold){
    // возврат назад
    swipeContainer.style.transform = "translateX(100%)";

    setTimeout(()=>{
      document.getElementById("prices").style.display="none";
      document.getElementById("categories").style.display="grid";
      renderCategories();
      swipeContainer.style.transition="none";
      swipeContainer.style.transform="translateX(0)";
      setTimeout(()=>{
        swipeContainer.style.transition=".25s ease";
      },50);
    },200);

  } else {
    swipeContainer.style.transform = "translateX(0)";
  }

  isSwiping = false;
});
  
loadData();
</script>

</body>
</html>
