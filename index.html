<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Deal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
/* =========================================================
   THEME TOKENS (Classic) + (Apple Liquid Glass MAX)
   ========================================================= */

/* -------- Classic (default) -------- */
:root{
  --bg:#000000;
  --bg2:#070707;
  --text:#ffffff;
  --muted: rgba(255,255,255,.72);

  /* Accent */
  --card1:#1DB954;
  --card2:#16a34a;

  /* Surfaces */
  --surface1:#121212;
  --surface2:#1c1c1c;

  /* Glass panel */
  --panelGlass: rgba(12,12,12,.45);

  /* Borders */
  --stroke1: rgba(255,255,255,.10);
  --stroke2: rgba(255,255,255,.06);

  /* Shadows */
  --shadow1: 0 8px 25px rgba(0,0,0,.60);
  --shadow2: 0 20px 60px rgba(0,0,0,.65);

  /* Accent hover */
  --accentBorder: rgba(29,185,84,.45);
  --accentGlow: rgba(29,185,84,.18);

  /* Icons */
  --stroke: rgba(255,255,255,.92);
  --fill: rgba(255,255,255,.06);
  --iconStrokeW: 1.7;

  /* Arrow capsule */
  --arrowBg1: rgba(255,255,255,.06);
  --arrowBg2: rgba(255,255,255,.02);
  --arrowStroke: rgba(255,255,255,.10);

  /* Price icon background */
  --priceIconBg: rgba(29,185,84,.12);

  /* Liquid glass helpers */
  --glassHighlight: rgba(255,255,255,.18);
  --glassShade: rgba(0,0,0,.25);

  /* Motion */
  --spring: cubic-bezier(.22,1.4,.36,1);
  --ease: cubic-bezier(.22,1,.36,1);

  /* Pointer highlight defaults (used for Apple Glass) */
  --px: 50%;
  --py: 25%;
}

/* -------- Apple Liquid Glass MAX (light) -------- */
body.theme-apple{
  --bg:#f5f6f8;
  --bg2:#ffffff;
  --text:#0b0c10;
  --muted: rgba(0,0,0,.60);

  /* categories become glass */
  --card1: rgba(255,255,255,.78);
  --card2: rgba(255,255,255,.42);

  --surface1: rgba(255,255,255,.78);
  --surface2: rgba(255,255,255,.45);

  --panelGlass: rgba(255,255,255,.66);

  --stroke1: rgba(0,0,0,.10);
  --stroke2: rgba(0,0,0,.08);

  --shadow1: 0 10px 30px rgba(0,0,0,.10);
  --shadow2: 0 26px 75px rgba(0,0,0,.14);

  --accentBorder: rgba(0,0,0,.14);
  --accentGlow: rgba(0,0,0,.06);

  --stroke: rgba(0,0,0,.78);
  --fill: rgba(0,0,0,.04);

  --arrowBg1: rgba(255,255,255,.90);
  --arrowBg2: rgba(255,255,255,.60);
  --arrowStroke: rgba(0,0,0,.10);

  --priceIconBg: rgba(0,0,0,.06);

  --glassHighlight: rgba(255,255,255,.70);
  --glassShade: rgba(0,0,0,.10);
}

/* =========================================================
   GLOBAL
   ========================================================= */
body, .category-card, .price-btn, .action-btn, .bottom-actions, .admin-card, .admin-btn, .admin-panel{
  transition:
    background .35s ease,
    color .35s ease,
    box-shadow .35s ease,
    border-color .35s ease,
    filter .35s ease,
    transform .35s var(--spring);
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%, var(--bg2), transparent 55%),
    var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text);
  overflow-x:hidden;
  padding-bottom:90px;
  position:relative;
}

/* Dark vignette only for Classic */
body:not(.theme-apple)::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  pointer-events:none;
}

/* Apple: bright “studio” backdrop + soft blobs (Liquid Glass max) */
body.theme-apple::before{
  content:"";
  position:fixed;
  inset:-20%;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.95), transparent 40%),
    radial-gradient(circle at 85% 15%, rgba(255,255,255,.85), transparent 45%),
    radial-gradient(circle at 60% 90%, rgba(255,255,255,.75), transparent 45%),
    radial-gradient(circle at 15% 70%, rgba(120,180,255,.18), transparent 55%),
    radial-gradient(circle at 85% 70%, rgba(255,165,120,.14), transparent 58%),
    radial-gradient(circle at 55% 35%, rgba(140,255,200,.10), transparent 60%);
  filter: blur(22px) saturate(115%);
  opacity:.95;
}

/* Subtle “grain” for Apple glass realism */
body.theme-apple::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0px, rgba(0,0,0,.03) 1px, transparent 2px, transparent 4px);
  opacity:.10;
  mix-blend-mode: soft-light;
}

h1{
  text-align:center;
  padding:24px 0 10px;
  font-size:22px;
  font-weight:900;
  letter-spacing:.2px;
  opacity:0;
  transform:translateY(-20px);
  animation:titleAppear .8s ease forwards;
}

@keyframes titleAppear{
  to{opacity:1;transform:translateY(0);}
}

/* =========================================================
   THEME TOGGLE
   ========================================================= */
.theme-toggle{
  position:fixed;
  top:18px;
  left:18px;
  z-index:1001;

  display:flex;
  align-items:center;
  gap:8px;

  height:38px;
  padding:0 12px;
  border-radius:14px;

  background: rgba(17,17,17,.55);
  border:1px solid var(--stroke1);
  color:#fff;

  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  cursor:pointer;
  user-select:none;
  transform: translateZ(0);
}

body.theme-apple .theme-toggle{
  background: rgba(255,255,255,.62);
  color: var(--text);
  box-shadow: 0 14px 34px rgba(0,0,0,.10);
}

.theme-toggle:active{ transform: scale(.98); }

.theme-dot{
  width:10px;
  height:10px;
  border-radius:999px;
  background: linear-gradient(135deg, var(--card1), var(--card2));
  box-shadow: 0 0 14px var(--accentGlow);
}

.theme-label{
  font-size:12px;
  font-weight:900;
  letter-spacing:.4px;
  opacity:.92;
}

/* =========================================================
   ICON SYSTEM
   ========================================================= */
.picon{
  width:46px;
  height:46px;
  stroke:var(--stroke);
  fill:var(--fill);
  stroke-width:var(--iconStrokeW);
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.22));
}
body.theme-apple .picon{
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.10));
}

.picon-sm{
  width:18px;
  height:18px;
  stroke:var(--stroke);
  fill:none;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.92;
}

/* =========================================================
   CATEGORIES
   ========================================================= */
.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:20px;
}

.category-card{
  border-radius:24px;
  padding:30px 20px;
  text-align:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;

  border:1px solid var(--stroke2);

  /* Classic: “premium gradient material” */
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.14), transparent 45%),
    radial-gradient(circle at 80% 85%, rgba(0,0,0,.35), transparent 55%),
    linear-gradient(135deg,var(--card1),var(--card2));

  box-shadow: 0 14px 35px rgba(0,0,0,.20);

  opacity:0;
  transform:translateY(50px) scale(.9);
  filter:blur(14px);
}

/* Apple Glass MAX: refractive + highlight follows finger */
body.theme-apple .category-card{
  background:
    radial-gradient(180px 140px at var(--px) var(--py), rgba(255,255,255,.78), transparent 60%),
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.70), transparent 42%),
    radial-gradient(circle at 80% 85%, rgba(0,0,0,.10), transparent 55%),
    linear-gradient(135deg, rgba(255,255,255,.78), rgba(255,255,255,.38));

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  box-shadow:
    0 18px 44px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.75),
    inset 0 -14px 28px rgba(0,0,0,.06);
}

/* specular sheen */
.category-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top left, rgba(255,255,255,.18), transparent 60%);
  opacity:.6;
}
body.theme-apple .category-card::after{
  opacity:.85;
}

/* animated “glass sheen ribbon” */
.category-card::before{
  content:"";
  position:absolute;
  inset:-50%;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,.22) 20%,
    rgba(255,255,255,.10) 40%,
    transparent 60%
  );
  transform: translateX(-35%) rotate(10deg);
  opacity:0;
  filter: blur(14px);
  pointer-events:none;
}

body.theme-apple .category-card::before{
  opacity:.55;
  animation: glassSheen 6.8s linear infinite;
}

@keyframes glassSheen{
  0%{ transform: translateX(-40%) rotate(10deg); }
  100%{ transform: translateX(40%) rotate(10deg); }
}

.category-card.show{
  animation:ultraAppear 1s var(--ease) forwards;
}

@keyframes ultraAppear{
  0%{opacity:0;transform:translateY(50px) scale(.9);filter:blur(14px);}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
}

.icon{ margin-bottom:14px; }

.label{
  font-size:15px;
  font-weight:800;
}

/* “spring press” */
.category-card:active{
  transform: translateY(2px) scale(.985);
}

/* =========================================================
   PRICES
   ========================================================= */
.prices{
  display:none;
  padding:20px;
}

.price-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

  background:linear-gradient(145deg,var(--surface1),var(--surface2));
  border:1px solid var(--stroke2);
  color:var(--text);

  padding:18px 20px;
  margin-bottom:16px;
  border-radius:20px;

  font-size:15px;
  font-weight:800;
  letter-spacing:.2px;

  cursor:pointer;
  position:relative;
  overflow:hidden;

  opacity:0;
  transform:translateY(15px);
  transition:all .45s var(--spring);

  box-shadow:
    var(--shadow1),
    inset 0 1px 0 rgba(255,255,255,.05);
}

body.theme-apple .price-btn{
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow:
    0 18px 44px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -16px 28px rgba(0,0,0,.06);

  /* liquid highlight follows finger */
  background:
    radial-gradient(240px 160px at var(--px) var(--py), rgba(255,255,255,.85), transparent 62%),
    linear-gradient(145deg,var(--surface1),var(--surface2));
}

.price-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.price-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background: var(--priceIconBg);
  color:transparent;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
}

body.theme-apple .price-icon{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.70),
    0 10px 18px rgba(0,0,0,.08);
}

.price-btn:hover{
  transform:translateY(-4px);
  border-color: var(--accentBorder);
  box-shadow:
    0 15px 40px var(--accentGlow),
    inset 0 1px 0 rgba(255,255,255,.08);
}

body.theme-apple .price-btn:hover{
  box-shadow:
    0 26px 64px rgba(0,0,0,.12),
    inset 0 1px 0 rgba(255,255,255,.92);
}

.price-btn:active{ transform:scale(.97); }

.back-btn{
  text-align:center;
  font-size:14px;
  opacity:.65;
  margin-top:6px;
  cursor:pointer;
}

/* =========================================================
   3D ARROW (small) – already requested
   ========================================================= */
.price-arrow{
  width:17px;
  height:17px;
  border-radius:6px;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:1;
  transition:all .35s var(--ease);

  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.16), transparent 55%),
    linear-gradient(145deg, var(--arrowBg1), var(--arrowBg2));

  border:1px solid var(--arrowStroke);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -4px 8px rgba(0,0,0,.18),
    0 6px 14px rgba(0,0,0,.22);
}

body.theme-apple .price-arrow{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.92),
    inset 0 -10px 18px rgba(0,0,0,.06),
    0 12px 22px rgba(0,0,0,.10);
}

.price-arrow svg{
  width:10px;
  height:10px;
  filter:
    drop-shadow(0 2px 0 rgba(0,0,0,.35))
    drop-shadow(0 0 8px var(--accentGlow));
  transform: translateY(-.5px);
}

.price-btn:hover .price-arrow{
  transform: translateY(-2px) rotateX(8deg);
  border-color: var(--accentBorder);
}

.price-btn:active .price-arrow{
  transform: translateY(0) scale(.96);
}

/* =========================================================
   iOS SWIPE BACK
   ========================================================= */
.swipeable{
  transition: transform .25s ease;
  will-change: transform;
}

/* =========================================================
   BOTTOM ACTIONS (GLASS)
   ========================================================= */
.bottom-actions{
  position:fixed;
  bottom: calc(18px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%) translateY(30px);
  width:90%;
  max-width:420px;

  display:flex;
  flex-direction:column;
  gap:14px;

  opacity:0;
  transition:.6s var(--ease);
  z-index:50;

  padding-bottom: calc(14px + env(safe-area-inset-bottom));
  padding-left:14px;
  padding-right:14px;

  background: var(--panelGlass);
  border: 1px solid var(--stroke2);
  border-radius: 22px;

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow:
    var(--shadow2),
    0 0 50px var(--accentGlow);
}

/* Apple: liquid glass max – extra depth */
body.theme-apple .bottom-actions{
  background:
    radial-gradient(260px 180px at var(--px) var(--py), rgba(255,255,255,.88), transparent 60%),
    var(--panelGlass);
  box-shadow:
    0 34px 90px rgba(0,0,0,.14),
    inset 0 1px 0 rgba(255,255,255,.92),
    inset 0 -16px 28px rgba(0,0,0,.06);
}

.bottom-actions.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.bottom-actions.hidden{
  opacity:0 !important;
  transform:translateX(-50%) translateY(30px) !important;
  pointer-events:none !important;
}

/* Signature (gold) */
.signature-wrapper{
  text-align:center;
  opacity:0;
  transform:translateY(6px);
  transition:.8s var(--ease);
}
.bottom-actions.show .signature-wrapper{
  opacity:1;
  transform:translateY(0);
}

.signature{
  font-size:12px;
  letter-spacing:.8px;
  font-family:"Brush Script MT","Segoe Script",cursive;

  background:linear-gradient(
    110deg,
    #8f6b1f 0%,
    #d4af37 25%,
    #f6e27a 45%,
    #ffffff 50%,
    #f6e27a 55%,
    #d4af37 75%,
    #8f6b1f 100%
  );

  background-size:250% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  animation:goldShimmer 6s linear infinite;

  text-shadow:
    0 0 4px rgba(212,175,55,.35),
    0 0 10px rgba(212,175,55,.15);
}

body.theme-apple .signature{
  text-shadow: 0 2px 10px rgba(0,0,0,.10);
}

.signature-line{
  margin:6px auto 0;
  width:120px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(212,175,55,.9), transparent);
  box-shadow:0 0 8px rgba(212,175,55,.4);
  opacity:.85;
}

@keyframes goldShimmer{
  from{ background-position:0% center; }
  to{ background-position:250% center; }
}

/* Buttons row */
.bottom-buttons{
  width:100%;
  display:flex;
  flex-direction:row;
  gap:12px;
}

.bottom-buttons .action-btn{
  flex:1;
  min-width:0;
  white-space:nowrap;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Action buttons */
.action-btn{
  padding:13px 16px;
  font-size:14px;
  font-weight:900;
  border-radius:18px;
  cursor:pointer;

  border:1px solid var(--stroke1);
  color:var(--text);

  background:linear-gradient(145deg,var(--surface1),var(--surface2));
  box-shadow:
    var(--shadow1),
    inset 0 1px 0 rgba(255,255,255,.05);

  transition:all .45s var(--spring);
  transform: translateZ(0);
}

body.theme-apple .action-btn{
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow:
    0 18px 44px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.92),
    inset 0 -16px 28px rgba(0,0,0,.06);

  background:
    radial-gradient(240px 160px at var(--px) var(--py), rgba(255,255,255,.90), transparent 62%),
    linear-gradient(145deg,var(--surface1),var(--surface2));
}

.action-btn:hover{
  transform:translateY(-3px);
  border-color: var(--accentBorder);
  box-shadow:
    0 15px 40px var(--accentGlow),
    inset 0 1px 0 rgba(255,255,255,.08);
}
body.theme-apple .action-btn:hover{
  box-shadow:
    0 26px 64px rgba(0,0,0,.12),
    inset 0 1px 0 rgba(255,255,255,.96);
}

.action-btn:active{ transform:scale(.96); }

.btn-content{
  display:inline-flex;
  align-items:center;
  gap:10px;
  justify-content:center;
  white-space:nowrap;
}

/* =========================================================
   ADMIN
   ========================================================= */
.admin-btn{
  position:fixed;
  top:18px !important;
  right:18px !important;
  z-index:1001;

  background:linear-gradient(145deg,var(--surface1),var(--surface2));
  border:1px solid var(--stroke1);
  color:var(--text);

  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
  font-weight:900;

  box-shadow: var(--shadow1);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.admin-panel{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% -10%, var(--bg2), transparent 55%),
    var(--bg);
  padding:25px;
  overflow-y:auto;
  display:none;
  z-index:1000;
}

.admin-card{
  background:linear-gradient(145deg,var(--surface1),var(--surface2));
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  border:1px solid var(--stroke2);
  box-shadow: var(--shadow1);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.admin-panel .close-x{
  position:fixed;
  top:18px;
  right:18px;
  z-index:1002;

  background:linear-gradient(145deg,var(--surface1),var(--surface2));
  border:1px solid var(--stroke1);
  color:var(--text);

  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  font-weight:900;
  box-shadow: var(--shadow1);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

/* =========================================================
   SKELETON
   ========================================================= */
.skeleton{
  height:112px;
  border-radius:24px;
  background: linear-gradient(145deg,var(--surface1),var(--surface2));
  border:1px solid var(--stroke2);
  box-shadow: var(--shadow1);
  position:relative;
  overflow:hidden;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.skeleton::after{
  content:"";
  position:absolute;
  inset:-60%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
  transform: translateX(-35%);
  animation: skeletonShimmer 1.15s ease-in-out infinite;
}

@keyframes skeletonShimmer{
  0%{ transform:translateX(-35%); }
  100%{ transform:translateX(35%); }
}

/* =========================================================
   RIPPLE
   ========================================================= */
.ripple{
  position:absolute;
  border-radius:999px;
  transform:scale(0);
  opacity:.35;
  background:rgba(255,255,255,.70);
  pointer-events:none;
  animation:ripple .6s ease-out forwards;
}
body.theme-apple .ripple{
  background: rgba(0,0,0,.14);
}

@keyframes ripple{
  to{ transform:scale(3.2); opacity:0; }
}
</style>
</head>

<body>

<h1>Smart Deal</h1>

<!-- Theme toggle (Classic ↔ Apple) -->
<div id="themeToggle" class="theme-toggle" onclick="toggleTheme()">
  <div class="theme-dot"></div>
  <div id="themeLabel" class="theme-label">Classic</div>
</div>

<!-- ✅ swipeContainer содержит ТОЛЬКО экраны -->
<div id="swipeContainer" class="swipeable">
  <div class="categories" id="categories"></div>
  <div class="prices" id="prices"></div>
</div>

<!-- ✅ Нижняя панель отдельно -->
<div class="bottom-actions" id="bottomActions">
  <div class="signature-wrapper">
    <div class="signature">Design and Developed by Fomintsev Denis</div>
    <div class="signature-line"></div>
  </div>

  <div class="bottom-buttons">
    <button class="action-btn outline" onclick="openFeedback()">
      <span class="btn-content">
        <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12c0 3.9-3.6 7-8 7-1 0-2-.1-2.9-.4L5 20l1-3.2C4.8 15.7 4 13.9 4 12c0-3.9 3.6-7 8-7s8 3.1 8 7z"></path>
          <path d="M8 11.5h8"></path>
          <path d="M8 14.5h5.5"></path>
        </svg>
        <span>Обратная связь</span>
      </span>
    </button>

    <button class="action-btn outline" onclick="openSite()">
      <span class="btn-content">
        <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"></circle>
          <path d="M3.8 12h16.4"></path>
          <path d="M12 3.5c2.2 2.3 3.5 5.2 3.5 8.5S14.2 18.2 12 20.5c-2.2-2.3-3.5-5.2-3.5-8.5S9.8 5.8 12 3.5z"></path>
        </svg>
        <span>Зайти на сайт</span>
      </span>
    </button>
  </div>
</div>

<!-- Admin -->
<button id="adminBtn" class="admin-btn" style="display:none;">⚙</button>
<div id="adminPanel" class="admin-panel"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const ADMIN_ID = 929524875;

/* ===== SERVER ANALYTICS ===== */
const ANALYTICS_URL = "https://script.google.com/macros/s/AKfycbxcIbUNFvrbt1BMSTPsAt6X7WBf44PXaDoSBu8x5PyqkwndQZVa2w2180AYaYQrRx7y/exec";

function sendAnalytics(data){
  fetch(ANALYTICS_URL,{ method:"POST", body:JSON.stringify(data) }).catch(()=>{});
}

const user = tg.initDataUnsafe?.user;
const isAdmin = user && user.id === ADMIN_ID;
if(isAdmin){
  document.getElementById("adminBtn").style.display="block";
}

function haptic(type="light"){
  if(tg.HapticFeedback){
    tg.HapticFeedback.impactOccurred(type);
  }
}

function openFeedback(){
  haptic("medium");
  tg.openTelegramLink("https://t.me/DFomintsev");
}

function openSite(){
  haptic("medium");
  tg.openLink("https://niceprice.pro", { try_instant_view: false });
}

/* ===== Bottom panel show/hide ===== */
function hideBottom(){
  document.getElementById("bottomActions")?.classList.add("hidden");
}
function showBottom(){
  document.getElementById("bottomActions")?.classList.remove("hidden");
}

/* ===== LOCAL STATS (fallback) ===== */
let stats = JSON.parse(localStorage.getItem("smartDealStats")) || {
  launches:0,
  users:[],
  categories:{},
  products:{}
};

stats.launches++;
sendAnalytics({
  user_id: user?.id || 0,
  username: user?.username || "",
  action: "launch"
});

if(user && !stats.users.includes(user.id)){
  stats.users.push(user.id);
}
localStorage.setItem("smartDealStats", JSON.stringify(stats));

/* ===== Google Sheets ===== */
const SHEET_URL="https://docs.google.com/spreadsheets/d/1-JYl4b-6H_iWvBS2Zsez1K1DPx35iBUCCPPRiSrVY7o/export?format=csv";
let data = {};

async function loadData(){
  renderSkeleton();
  const response = await fetch(SHEET_URL);
  const text = await response.text();
  const rows = text.split("\n").slice(1);

  rows.forEach(rawRow=>{
    const row = rawRow.trim();
    if(!row) return;

    const parts = row.split(",");
    const category = (parts[0] || "").trim();
    const price = (parts[1] || "").trim();
    const link = parts.slice(2).join(",").trim();

    if(!category) return;
    if(!data[category]) data[category] = [];
    data[category].push({ price, link });
  });

  renderCategories();
  enableRipples();

  setTimeout(()=>{
    document.getElementById("bottomActions").classList.add("show");
  }, 700);
}

/* ===== Icons ===== */
function getIcon(category){
  const icons = {
    "Смартфоны": `
      <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="2.2"></rect>
        <line x1="10" y1="5.5" x2="14" y2="5.5"></line>
        <circle cx="12" cy="18.2" r="0.9" fill="none"></circle>
      </svg>
    `,
    "Ноутбуки": `
      <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="6" width="14" height="9" rx="2"></rect>
        <path d="M3.5 17.2h17"></path>
        <path d="M8 17.2l.8 1.6h6.4l.8-1.6"></path>
      </svg>
    `,
    "Планшеты": `
      <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="3.2" width="12" height="17.6" rx="2.2"></rect>
        <circle cx="12" cy="17.8" r="0.9" fill="none"></circle>
      </svg>
    `,
    "Телевизоры": `
      <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="6" width="16" height="10" rx="2.2"></rect>
        <path d="M9 20h6"></path>
        <path d="M12 16v4"></path>
      </svg>
    `
  };

  return icons[category] || `
    <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8"></circle>
      <path d="M9.5 12h5"></path>
    </svg>
  `;
}

/* ===== Categories ===== */
function renderCategories(){
  const container = document.getElementById("categories");
  container.innerHTML = "";
  container.style.display = "grid";
  showBottom();

  Object.keys(data).forEach((category,index)=>{
    const div = document.createElement("div");
    div.className = "category-card";

    div.innerHTML = `
      <div class="icon">${getIcon(category)}</div>
      <div class="label">${category}</div>
    `;

    div.onclick = ()=>{
      if(!stats.categories[category]) stats.categories[category]=0;
      stats.categories[category]++;

      sendAnalytics({
        user_id: user?.id || 0,
        username: user?.username || "",
        action: "category_click",
        category
      });

      localStorage.setItem("smartDealStats", JSON.stringify(stats));
      showPrices(category);
    };

    container.appendChild(div);
    setTimeout(()=>div.classList.add("show"), index*140);
  });
}

/* ===== Prices ===== */
function showPrices(category){
  const categoriesBlock = document.getElementById("categories");
  const pricesDiv = document.getElementById("prices");

  haptic("medium");
  hideBottom();

  categoriesBlock.style.display="none";
  pricesDiv.style.display="block";
  pricesDiv.innerHTML="";

  (data[category] || []).forEach((item,index)=>{
    const btn=document.createElement("button");
    btn.className="price-btn";
    btn.innerHTML = `
      <div class="price-left">
        <div class="price-icon">
          <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 8.5c0-1.9 1.7-3.5 5-3.5s5 1.2 5 3.1-1.4 2.5-5 2.9-5 1.1-5 2.9 1.7 3.1 5 3.1 5-1.6 5-3.5"></path>
            <path d="M12 4v16"></path>
          </svg>
        </div>
        <div>${item.price || ""}</div>
      </div>
      <div class="price-arrow">
        <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h12"></path>
          <path d="M13 7l5 5-5 5"></path>
        </svg>
      </div>
    `;

    btn.onclick=()=>{
      const key=category+" | "+(item.price || "");
      if(!stats.products[key]) stats.products[key]=0;
      stats.products[key]++;

      sendAnalytics({
        user_id: user?.id || 0,
        username: user?.username || "",
        action: "product_click",
        category,
        product: item.price,
        price: item.price
      });

      localStorage.setItem("smartDealStats", JSON.stringify(stats));
      if(item.link) tg.openLink(item.link);
    };

    pricesDiv.appendChild(btn);

    setTimeout(()=>{
      btn.style.opacity="1";
      btn.style.transform="translateY(0)";
    },index*80);
  });

  const back=document.createElement("div");
  back.className="back-btn";
  back.innerText="← Назад";
  back.onclick=()=>{
    pricesDiv.style.display="none";
    categoriesBlock.style.display="grid";
    renderCategories();
    showBottom();
  };

  pricesDiv.appendChild(back);
  enableRipples();
}

/* ===== Admin Panel (server) ===== */
document.getElementById("adminBtn").onclick = async () => {
  const panel = document.getElementById("adminPanel");
  panel.style.display = "block";
  panel.innerHTML = `<button class="close-x" onclick="closeAdmin()">✕</button>Загрузка...`;
  hideBottom();

  try{
    const response = await fetch(ANALYTICS_URL);
    const s = await response.json();

    const conversion = s.launches > 0
      ? ((s.product_clicks / s.launches) * 100).toFixed(1)
      : 0;

    panel.innerHTML = `
      <button class="close-x" onclick="closeAdmin()">✕</button>
      <h2 style="margin-bottom:20px;">📊 Smart Deal Admin 3.0</h2>

      <div class="admin-card">🚀 Всего запусков: <b>${s.launches}</b></div>
      <div class="admin-card">👤 Всего пользователей: <b>${s.unique_users}</b></div>
      <div class="admin-card">🛒 Всего кликов: <b>${s.product_clicks}</b></div>
      <div class="admin-card">📈 Общая конверсия: <b>${conversion}%</b></div>

      <h3 style="margin-top:25px;">📅 Сегодня</h3>
      <div class="admin-card">🚀 Запусков сегодня: <b>${s.today_launches}</b></div>
      <div class="admin-card">👤 Новых сегодня: <b>${s.today_users}</b></div>
      <div class="admin-card">🛒 Кликов сегодня: <b>${s.today_product_clicks}</b></div>
    `;
  } catch(e){
    panel.innerHTML = `<button class="close-x" onclick="closeAdmin()">✕</button>Ошибка загрузки данных`;
  }
};

function closeAdmin(){
  document.getElementById("adminPanel").style.display="none";
  const pricesVisible = document.getElementById("prices").style.display === "block";
  if(!pricesVisible) showBottom();
}

/* ===== SWIPE BACK SYSTEM ===== */
let startX = 0;
let currentX = 0;
let isSwiping = false;
const swipeZone = 40;
const threshold = 90;

const swipeContainer = document.getElementById("swipeContainer");

swipeContainer.addEventListener("touchstart", e => {
  if(document.getElementById("prices").style.display !== "block") return;

  if(e.touches[0].clientX < swipeZone){
    isSwiping = true;
    startX = e.touches[0].clientX;
    currentX = startX;
  }
});

swipeContainer.addEventListener("touchmove", e => {
  if(!isSwiping) return;

  currentX = e.touches[0].clientX;
  const diff = currentX - startX;

  if(diff > 0){
    swipeContainer.style.transform = `translateX(${diff}px)`;
  }
});

swipeContainer.addEventListener("touchend", () => {
  if(!isSwiping) return;

  const diff = currentX - startX;

  if(diff > threshold){
    swipeContainer.style.transform = "translateX(100%)";

    setTimeout(()=>{
      document.getElementById("prices").style.display="none";
      document.getElementById("categories").style.display="grid";
      renderCategories();
      showBottom();

      swipeContainer.style.transition="none";
      swipeContainer.style.transform="translateX(0)";
      setTimeout(()=>{ swipeContainer.style.transition=".25s ease"; },50);
    },200);
  } else {
    swipeContainer.style.transform = "translateX(0)";
  }

  isSwiping = false;
});

/* ===== Skeleton ===== */
function renderSkeleton(){
  const container = document.getElementById("categories");
  container.innerHTML = "";
  container.style.display = "grid";
  for(let i=0;i<4;i++){
    const sk = document.createElement("div");
    sk.className = "skeleton";
    container.appendChild(sk);
  }
}

/* ===== Ripple ===== */
function enableRipples(){
  const attach = (el) => {
    if(!el || el.dataset.ripple) return;
    el.dataset.ripple = "1";

    el.addEventListener("click", (e)=>{
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size/2;
      const y = e.clientY - rect.top - size/2;

      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = x + "px";
      ripple.style.top = y + "px";

      el.appendChild(ripple);
      setTimeout(()=>ripple.remove(), 650);
    }, { passive:true });
  };

  document.querySelectorAll(".action-btn, .price-btn, .category-card").forEach(attach);
}

/* =========================================================
   Liquid Glass MAX: pointer highlight follows touch/mouse
   (Updates CSS vars --px/--py for Apple theme)
   ========================================================= */
let raf = 0;
function setPointerVars(x,y){
  if(raf) return;
  raf = requestAnimationFrame(()=>{
    raf = 0;
    const px = Math.max(0, Math.min(100, (x / window.innerWidth) * 100)).toFixed(2) + "%";
    const py = Math.max(0, Math.min(100, (y / window.innerHeight) * 100)).toFixed(2) + "%";
    document.documentElement.style.setProperty("--px", px);
    document.documentElement.style.setProperty("--py", py);
  });
}

window.addEventListener("mousemove", (e)=>{
  if(!document.body.classList.contains("theme-apple")) return;
  setPointerVars(e.clientX, e.clientY);
}, { passive:true });

window.addEventListener("touchmove", (e)=>{
  if(!document.body.classList.contains("theme-apple")) return;
  const t = e.touches && e.touches[0];
  if(!t) return;
  setPointerVars(t.clientX, t.clientY);
}, { passive:true });

/* =========================================================
   Theme Switcher: Classic ↔ Apple (no Luxury)
   ========================================================= */
const THEME_KEY = "smartdeal_theme"; // classic | apple

function applyTheme(theme){
  const t = (theme === "apple") ? "apple" : "classic";
  document.body.classList.toggle("theme-apple", t === "apple");

  const label = document.getElementById("themeLabel");
  if(label) label.textContent = (t === "apple") ? "Apple" : "Classic";

  localStorage.setItem(THEME_KEY, t);

  // tiny pulse
  try{
    document.body.animate(
      [{ filter:"brightness(1.0)" }, { filter:"brightness(1.05)" }, { filter:"brightness(1.0)" }],
      { duration: 220, easing:"ease-out" }
    );
  }catch(_){}

  haptic(t === "apple" ? "light" : "light");
}

function toggleTheme(){
  const current = localStorage.getItem(THEME_KEY) || "classic";
  applyTheme(current === "apple" ? "classic" : "apple");
}

// start theme
applyTheme(localStorage.getItem(THEME_KEY) || "classic");

// start data
loadData();
</script>

</body>
</html>
