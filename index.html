<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Deal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#000000;
  --card1:#1DB954;
  --card2:#16a34a;

  /* Icon system */
  --iconStroke: rgba(255,255,255,.92);
  --iconFill: rgba(255,255,255,.06);
  --iconStrokeW: 1.7;

  /* Surfaces */
  --surface1: linear-gradient(145deg,#121212,#1c1c1c);
  --surface2: linear-gradient(145deg,#0f0f0f,#171717);

  /* Lines + text */
  --lineSoft: rgba(255,255,255,.08);
  --lineSofter: rgba(255,255,255,.06);
  --text: #fff;
  --muted: rgba(255,255,255,.75);

  /* Motion */
  --spring: cubic-bezier(.22,1.4,.36,1);
  --ease: cubic-bezier(.22,1,.36,1);

  /* Glass */
  --glassBg: rgba(12,12,12,.45);
  --glassBlur: 20px;
}

*{ box-sizing:border-box; }

html, body{ height:100%; }

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text);
  overflow-x:hidden;
  padding-bottom:90px;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  pointer-events:none;
}

/* ===== Title ===== */
h1{
  text-align:center;
  padding:24px 0 10px;
  font-size:22px;
  font-weight:700;
  opacity:0;
  transform:translateY(-20px);
  animation:titleAppear .8s var(--ease) forwards;
}

@keyframes titleAppear{
  to{opacity:1;transform:translateY(0);}
}

/* ===== Icons ===== */
.picon{
  width:46px;
  height:46px;
  stroke:var(--iconStroke);
  fill:var(--iconFill);
  stroke-width:var(--iconStrokeW);
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.22));
}

.picon-sm{
  width:18px;
  height:18px;
  stroke:var(--iconStroke);
  fill:none;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.92;
}

/* ===== Screens container (swipe) ===== */
.swipeable{
  transition: transform .25s ease;
  will-change: transform;
}

/* ===== Categories ===== */
.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:20px;
}

.category-card{
  border-radius:24px;
  padding:30px 20px;
  text-align:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;

  border:1px solid var(--lineSoft);
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.14), transparent 45%),
    radial-gradient(circle at 80% 85%, rgba(0,0,0,.35), transparent 55%),
    linear-gradient(135deg,var(--card1),var(--card2));

  box-shadow:0 12px 35px rgba(29,185,84,0.35);

  opacity:0;
  transform:translateY(50px) scale(.9);
  filter:blur(14px);

  transition: transform .45s var(--spring), filter .45s var(--spring), box-shadow .45s var(--spring), border-color .45s var(--spring);
}

.category-card.show{
  animation:ultraAppear 1s var(--ease) forwards;
}

@keyframes ultraAppear{
  0%{opacity:0;transform:translateY(50px) scale(.9);filter:blur(14px);}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
}

.category-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top left, rgba(255,255,255,.18), transparent 60%);
  opacity:.6;
}

.icon{ margin-bottom:14px; position:relative; z-index:1; }
.label{ font-size:15px; font-weight:600; position:relative; z-index:1; }

/* ===== Prices ===== */
.prices{
  display:none;
  padding:20px;
}

.price-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  background:var(--surface1);
  border:1px solid var(--lineSofter);
  color:var(--text);

  padding:9px 10px;              /* было 18px 20px */
  border-radius:12px;            /* было 20px */

  font-size:13px;                /* было 15px */
  font-weight:600;
  letter-spacing:.2px;

  cursor:pointer;
  position:relative;
  overflow:hidden;

  opacity:0;
  transform:translateY(10px);     /* было 15px */

  box-shadow:
    0 4px 12px rgba(0,0,0,.55),   /* уменьшили */
    inset 0 1px 0 rgba(255,255,255,.05);

  transition: transform .35s var(--spring),
              box-shadow .35s var(--spring),
              border-color .35s var(--spring);
}
  
.price-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.price-left > div:last-child{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.price-icon{
  width:22px;         /* было 34px */
  height:22px;        /* было 34px */
  border-radius:6px;  /* было 10px */

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(29,185,84,.12);
  color:transparent;
  flex:0 0 auto;
}

.price-btn:hover{
  transform:translateY(-4px);
  border-color:rgba(29,185,84,.5);
  box-shadow:
    0 15px 40px rgba(29,185,84,.25),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.price-btn:active{ transform:scale(.97); }

.back-btn{
  text-align:center;
  font-size:14px;
  opacity:.6;
  margin-top:6px;
  cursor:pointer;
  user-select:none;
}

/* ===== 3D Arrow (right) ===== */
.price-arrow{
  width:12px;     /* было 17px */
  height:12px;    /* было 17px */
  border-radius:4px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.16), transparent 55%),
    linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));

  border:1px solid var(--lineSoft);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -3px 6px rgba(0,0,0,.35),
    0 3px 8px rgba(0,0,0,.5);

  transition: transform .25s var(--ease),
              box-shadow .25s var(--ease),
              border-color .25s var(--ease);
}

.price-arrow svg{
  width:7px;     /* было 10px */
  height:7px;
}

.price-btn:hover .price-arrow{
  transform: translateY(-2px) rotateX(8deg);
  border-color: rgba(29,185,84,.35);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -12px 20px rgba(0,0,0,.38),
    0 14px 28px rgba(29,185,84,.18),
    0 18px 40px rgba(0,0,0,.55);
}

.price-btn:active .price-arrow{
  transform: translateY(0) scale(.96);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -14px 22px rgba(0,0,0,.45),
    0 8px 18px rgba(0,0,0,.55);
}

/* ===== Bottom actions (glass) ===== */
.bottom-actions{
  position:fixed;
  left:50%;
  transform:translateX(-50%) translateY(30px);
  width:90%;
  max-width:420px;
  z-index:50;

  display:flex;
  flex-direction:column;
  gap:14px;

  opacity:0;
  transition:.6s var(--ease);

  bottom: calc(18px + env(safe-area-inset-bottom));
  padding: 0 14px calc(14px + env(safe-area-inset-bottom));

  background: var(--glassBg);
  border:none;
  border-radius:22px;

  backdrop-filter: blur(var(--glassBlur));
  -webkit-backdrop-filter: blur(var(--glassBlur));

  box-shadow:
    0 20px 60px rgba(0,0,0,.65),
    0 0 50px rgba(29,185,84,.08);
}

.bottom-actions.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.bottom-actions.hidden{
  opacity:0 !important;
  transform:translateX(-50%) translateY(30px) !important;
  pointer-events:none !important;
}

/* Signature */
.signature-wrapper{
  text-align:center;
  opacity:0;
  transform:translateY(6px);
  transition:.8s var(--ease);
  padding-top:14px;
}

.bottom-actions.show .signature-wrapper{
  opacity:1;
  transform:translateY(0);
}

.signature{
  font-size:12px;
  letter-spacing:.8px;
  font-family:"Brush Script MT","Segoe Script",cursive;

  background:linear-gradient(
    110deg,
    #8f6b1f 0%,
    #d4af37 25%,
    #f6e27a 45%,
    #ffffff 50%,
    #f6e27a 55%,
    #d4af37 75%,
    #8f6b1f 100%
  );
  background-size:250% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  animation:goldShimmer 6s linear infinite;

  text-shadow:
    0 0 4px rgba(212,175,55,.35),
    0 0 10px rgba(212,175,55,.15);
}

.signature-line{
  margin:6px auto 0;
  width:120px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(212,175,55,.9), transparent);
  box-shadow:0 0 8px rgba(212,175,55,.4);
  opacity:.8;
}

@keyframes goldShimmer{
  from{ background-position:0% center; }
  to{ background-position:250% center; }
}

/* Buttons row */
.bottom-buttons{
  width:100%;
  display:flex;
  flex-direction:row;
  gap:12px;
  padding: 0 0 14px;
}

.bottom-buttons .action-btn{
  flex:1;
  min-width:0;
  white-space:nowrap;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Buttons */
.action-btn{
  padding:13px 16px;
  font-size:14px;
  font-weight:600;
  border-radius:18px;
  cursor:pointer;
  border:1px solid var(--lineSoft);
  color:var(--text);

  background:var(--surface1);
  box-shadow:
    0 8px 25px rgba(0,0,0,.60),
    inset 0 1px 0 rgba(255,255,255,.05);

  transition: transform .45s var(--spring), box-shadow .45s var(--spring), border-color .45s var(--spring);
}

.action-btn:hover{
  transform:translateY(-3px);
  border-color:rgba(29,185,84,.4);
  box-shadow:
    0 15px 40px rgba(29,185,84,.25),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.action-btn:active{ transform:scale(.96); }

/* Keep class for HTML compatibility */
.action-btn.outline{}

/* Button content */
.btn-content{
  display:inline-flex;
  align-items:center;
  gap:10px;
  justify-content:center;
  white-space:nowrap;
}

/* ===== Admin ===== */
.admin-btn{
  position:fixed;
  top:18px;
  right:18px;
  z-index:1001;
  background:rgba(17,17,17,.85);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.admin-panel{
  position:fixed;
  inset:0;
  background:#000;
  padding:25px;
  overflow-y:auto;
  display:none;
  z-index:1000;
}

.admin-panel .close-x{
  position:fixed;
  top:18px;
  right:18px;
  z-index:1002;

  background:rgba(17,17,17,.85);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;

  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.admin-card{
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;

  border:1px solid rgba(255,255,255,.08);
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.10), transparent 55%),
    linear-gradient(145deg,#101010,#171717);

  box-shadow:
    0 12px 34px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.05);

  transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
}

.admin-card.clickable{
  cursor:pointer;
}

.admin-card.clickable:hover{
  transform:translateY(-2px);
  border-color:rgba(29,185,84,.35);
  box-shadow:
    0 16px 44px rgba(29,185,84,.12),
    inset 0 1px 0 rgba(255,255,255,.06);
}

/* ===== Admin swipe-back ===== */
.admin-panel{
  will-change: transform;
  transition: transform .25s ease;
}

/* ===== Users (admin) ===== */
.users-box{ margin-top:14px; }

.users-toolbar{
  display:flex;
  gap:10px;
  margin:10px 0 12px;
}

.users-toolbar button{
  flex:1;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  background:var(--surface2);
  color:#fff;
  cursor:pointer;

  transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}

.users-toolbar button:hover{
  transform:translateY(-1px);
  border-color:rgba(255,255,255,.18);
  box-shadow:0 10px 24px rgba(0,0,0,.35);
}

.users-toolbar button:active{ transform:scale(.98); }

.users-list{
  background:var(--surface2);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:12px;
}

.user-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:13px;
}

.user-row:last-child{ border-bottom:none; }

.user-id{
  opacity:.9;
  font-variant-numeric: tabular-nums;
}

.user-name{
  opacity:.75;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:55%;
  text-align:right;
}

.users-empty{
  opacity:.75;
  font-size:13px;
  line-height:1.5;
}

/* ===== Skeleton loading ===== */
.skeleton{
  height:112px;
  border-radius:24px;
  background: linear-gradient(145deg,#0f0f0f,#1a1a1a);
  border:1px solid rgba(255,255,255,.06);
  box-shadow: 0 14px 40px rgba(0,0,0,.6);
  position:relative;
  overflow:hidden;
}

.skeleton::after{
  content:"";
  position:absolute;
  inset:-60%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
  transform: translateX(-35%);
  animation: skeletonShimmer 1.15s ease-in-out infinite;
}

@keyframes skeletonShimmer{
  0%{ transform:translateX(-35%); }
  100%{ transform:translateX(35%); }
}

/* ===== Ripple effect ===== */
.ripple{
  position:absolute;
  border-radius:999px;
  transform:scale(0);
  opacity:.35;
  background:rgba(255,255,255,.70);
  pointer-events:none;
  animation:ripple .6s ease-out forwards;
}

@keyframes ripple{
  to{ transform:scale(3.2); opacity:0; }
}

/* ===== Favorites UI (star as separate element next to row) ===== */
.price-row{
  display:flex;
  gap:8px;
  align-items:stretch;
  margin-bottom:10px;
}

.price-row .price-btn{
  margin-bottom:0; /* потому что теперь margin у строки */
  flex:1;
  min-width:0;
}

.fav-star{
  flex:0 0 26px;
  width:26px;
  border-radius:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.10);
  background: linear-gradient(145deg, rgba(255,255,255,.05), rgba(255,255,255,.02));

  box-shadow:
    0 8px 25px rgba(0,0,0,.60),
    inset 0 1px 0 rgba(255,255,255,.05);

  cursor:pointer;
  transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}

.fav-star:hover{
  transform: translateY(-2px);
  border-color: rgba(29,185,84,.35);
  box-shadow:
    0 14px 34px rgba(29,185,84,.12),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.fav-star:active{ transform:scale(.96); }

.fav-star svg{
  width:12px;
  height:12px;
  stroke: rgba(255,255,255,.92);
  stroke-width:1.9;
  fill: rgba(255,255,255,.06);
}

.fav-star.on svg{
  fill: rgba(29,185,84,.55);
  filter: drop-shadow(0 0 10px rgba(29,185,84,.25));
}

/* ===== Top favorites button ===== */
.fav-top{
  position:fixed;
  top:18px;
  left:18px;
  z-index:1001;
  width:42px;
  height:42px;
  border-radius:14px;

  background:rgba(17,17,17,.85);
  border:1px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.fav-top svg{ width:18px; height:18px; }

.fav-badge{
  position:absolute;
  top:-6px;
  right:-6px;
  min-width:18px;
  height:18px;
  padding:0 6px;
  border-radius:999px;
  background:rgba(29,185,84,.95);
  color:#000;
  font-size:11px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 25px rgba(29,185,84,.25);
}

/* ===== Favorites panel ===== */
.fav-panel{
  position:fixed;
  inset:0;
  background:#000;
  padding:25px;
  overflow-y:auto;
  display:none;
  z-index:999;
  will-change: transform;
  transition: transform .25s ease;
}

.fav-panel .close-x{
  position:fixed;
  top:18px;
  right:18px;
  z-index:1002;

  background:rgba(17,17,17,.85);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;

  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.fav-empty{
  opacity:.75;
  line-height:1.5;
  padding:12px 0;
}

</style>
</head>

<body>

<h1>Smart Deal</h1>

<div id="swipeContainer" class="swipeable">
  <div class="categories" id="categories"></div>
  <div class="prices" id="prices"></div>
</div>

<div class="bottom-actions" id="bottomActions">
  <div class="signature-wrapper">
    <div class="signature">Design and Developed by Fomintsev Denis</div>
    <div class="signature-line"></div>
  </div>

  <div class="bottom-buttons">
    <button class="action-btn outline" onclick="openFeedback()">
      <span class="btn-content">
        <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12c0 3.9-3.6 7-8 7-1 0-2-.1-2.9-.4L5 20l1-3.2C4.8 15.7 4 13.9 4 12c0-3.9 3.6-7 8-7s8 3.1 8 7z"></path>
          <path d="M8 11.5h8"></path>
          <path d="M8 14.5h5.5"></path>
        </svg>
        <span>Обратная связь</span>
      </span>
    </button>

    <button class="action-btn outline" onclick="openSite()">
      <span class="btn-content">
        <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"></circle>
          <path d="M3.8 12h16.4"></path>
          <path d="M12 3.5c2.2 2.3 3.5 5.2 3.5 8.5S14.2 18.2 12 20.5c-2.2-2.3-3.5-5.2-3.5-8.5S9.8 5.8 12 3.5z"></path>
        </svg>
        <span>Зайти на сайт</span>
      </span>
    </button>
  </div>
</div>

<button id="favTopBtn" class="fav-top" title="Избранное">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 3.5l2.8 5.8 6.4.9-4.6 4.5 1.1 6.4L12 18.6 6.3 21.1l1.1-6.4L2.8 10.2l6.4-.9L12 3.5z"></path>
  </svg>
  <div id="favBadge" class="fav-badge" style="display:none;">0</div>
</button>

<div id="favPanel" class="fav-panel"></div>

<button id="adminBtn" class="admin-btn" style="display:none;">⚙</button>
<div id="adminPanel" class="admin-panel"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const ADMIN_ID = 929524875;
const ANALYTICS_URL = "https://script.google.com/macros/s/AKfycbxcIbUNFvrbt1BMSTPsAt6X7WBf44PXaDoSBu8x5PyqkwndQZVa2w2180AYaYQrRx7y/exec";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1-JYl4b-6H_iWvBS2Zsez1K1DPx35iBUCCPPRiSrVY7o/export?format=csv";

function sendAnalytics(data){
  fetch(ANALYTICS_URL,{ method:"POST", body:JSON.stringify(data) }).catch(()=>{});
}

const user = tg.initDataUnsafe?.user;
const isAdmin = user && user.id === ADMIN_ID;

/* ===== Favorites (per-user localStorage) ===== */
const FAV_KEY = `smartDealFav_v2_${user?.id || 0}`;

function getFavs(){
  try{
    const raw = localStorage.getItem(FAV_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}

function setFavs(arr){
  localStorage.setItem(FAV_KEY, JSON.stringify(arr));
  updateFavBadge();
}

function favId(item){
  return `${item.category}|||${item.price || ""}|||${item.link || ""}`;
}

function isFav(item){
  const id = favId(item);
  return getFavs().some(x => x.id === id);
}

function toggleFav(item){
  const id = favId(item);
  const list = getFavs();
  const idx = list.findIndex(x => x.id === id);

/* ===== Robust CSV parsing (handles quotes/commas) ===== */
function parseCSVLine(line){
  const out = [];
  let cur = "";
  let inQuotes = false;

  for(let i=0;i<line.length;i++){
    const ch = line[i];
    const next = line[i+1];

    if(ch === '"' && inQuotes && next === '"'){
      cur += '"'; i++;
      continue;
    }
    if(ch === '"'){
      inQuotes = !inQuotes;
      continue;
    }
    if(ch === "," && !inQuotes){
      out.push(cur);
      cur = "";
      continue;
    }
    cur += ch;
  }
  out.push(cur);
  return out.map(s => String(s ?? "").trim());
}

    rows.forEach(rawRow=>{

      const parts = parseCSVLine(row);
      const category = (parts[0] || "").trim();

      /* FIX: link uses the rest of columns, safer with commas/extra fields */
      const link = parts.slice(2).join(",").trim();

      data[category].push({ price, link });
    });

/* ===== SWIPE BACK (Admin Panel) ===== */
(function enableAdminSwipeBack(){
  const adminPanel = document.getElementById("adminPanel");
  if(!adminPanel) return;

  let startX = 0, startY = 0, currentX = 0;
  let isSwiping = false;
  let locked = false; // определили направление

  const swipeZone = 40;    // зона от левого края
  const threshold = 90;    // сколько нужно провести
  const vertTolerance = 14; // допуск по вертикали до "фикса" свайпа

  adminPanel.addEventListener("touchstart", (e) => {
    if(adminPanel.style.display !== "block") return;

    const t = e.touches[0];
    if(t.clientX > swipeZone) return;

    isSwiping = true;
    locked = false;
    startX = t.clientX;
    startY = t.clientY;
    currentX = startX;

    // на всякий случай: чтобы не было залипания после прошлых анимаций
    adminPanel.style.transition = "transform .25s ease";
  }, { passive:true });

  adminPanel.addEventListener("touchmove", (e) => {
    if(!isSwiping) return;

    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;

    // фиксируем, что это именно горизонтальный свайп, а не скролл
    if(!locked){
      if(Math.abs(dy) > vertTolerance && Math.abs(dy) > Math.abs(dx)){
        // это скорее вертикальный скролл — не мешаем
        isSwiping = false;
        adminPanel.style.transform = "translateX(0)";
        return;
      }
      if(Math.abs(dx) > 6) locked = true;
    }

    if(dx > 0){
      // когда реально тянем вправо — лучше не скроллить контент панели
      e.preventDefault();
      currentX = t.clientX;
      adminPanel.style.transform = `translateX(${dx}px)`;
    }
  }, { passive:false });

  adminPanel.addEventListener("touchend", () => {
    if(!isSwiping) return;

    const dx = currentX - startX;

    if(dx > threshold){
      adminPanel.style.transform = "translateX(100%)";

      setTimeout(() => {
        closeAdmin();                 // ✅ закрываем админку
        adminPanel.style.transition = "none";
        adminPanel.style.transform = "translateX(0)";
        // возвращаем transition обратно
        requestAnimationFrame(() => {
          adminPanel.style.transition = "transform .25s ease";
        });
      }, 200);
    } else {
      adminPanel.style.transform = "translateX(0)";
    }

    isSwiping = false;
  }, { passive:true });
})();

/* ===== SWIPE BACK SYSTEM ===== */
let startX = 0;
let currentX = 0;
let isSwiping = false;
const swipeZone = 40;
const threshold = 90;

const swipeContainer = document.getElementById("swipeContainer");

swipeContainer.addEventListener("touchstart", e => {
  if(document.getElementById("prices").style.display !== "block") return;

  if(e.touches[0].clientX < swipeZone){
    isSwiping = true;
    startX = e.touches[0].clientX;
    currentX = startX;
  }
}, { passive:true });

swipeContainer.addEventListener("touchmove", e => {
  if(!isSwiping) return;

  currentX = e.touches[0].clientX;
  const diff = currentX - startX;

  if(diff > 0){
    swipeContainer.style.transform = `translateX(${diff}px)`;
  }
}, { passive:true });

swipeContainer.addEventListener("touchend", () => {
  if(!isSwiping) return;

  const diff = currentX - startX;

  if(diff > threshold){
    swipeContainer.style.transform = "translateX(100%)";

    setTimeout(()=>{
      document.getElementById("prices").style.display="none";
      document.getElementById("categories").style.display="grid";
      renderCategories();
      showBottom();

      swipeContainer.style.transition="none";
      swipeContainer.style.transform="translateX(0)";
      setTimeout(()=>{ swipeContainer.style.transition=".25s ease"; },50);
    },200);
  } else {
    swipeContainer.style.transform = "translateX(0)";
  }

  isSwiping = false;
}, { passive:true });

function renderSkeleton(){
  const container = document.getElementById("categories");
  container.innerHTML = "";
  container.style.display = "grid";

    const sk = document.createElement("div");

function enableRipples(){
  const attach = (el) => {
    if(!el || el.dataset.ripple) return;
    el.dataset.ripple = "1";

    el.addEventListener("click", (e)=>{
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size/2;
      const y = e.clientY - rect.top - size/2;

      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = x + "px";
      ripple.style.top = y + "px";

      el.appendChild(ripple);
      setTimeout(()=>ripple.remove(), 650);
    }, { passive:true });
  };

  document
    .querySelectorAll(".action-btn, .price-btn, .category-card, .admin-card.clickable, .users-toolbar button, .fav-star, .fav-top")
    .forEach(attach);
}

/* ===== Users (server) ===== */
async function fetchUsersFromServer(scope){
  const urls = [
    `${ANALYTICS_URL}?action=users&scope=${encodeURIComponent(scope)}`,
    `${ANALYTICS_URL}?users=1&scope=${encodeURIComponent(scope)}`
  ];

  for(const url of urls){
    try{
      const r = await fetch(url);
      const j = await r.json();

      let list = null;

      if(Array.isArray(j?.users)) list = j.users;
      else if(j?.users && typeof j.users === "object") {
        list = Object.entries(j.users).map(([id, name]) => ({ user_id: Number(id), username: String(name || "") }));
      }
      else if(Array.isArray(j?.all_users) && scope === "all") list = j.all_users;
      else if(Array.isArray(j?.today_users_list) && scope === "today") list = j.today_users_list;

      if(list){
        return list
          .map(u => ({
            user_id: Number(u.user_id ?? u.id ?? 0),
            username: String(u.username ?? u.user ?? u.name ?? "").trim()
          }))
          .filter(u => u.user_id);
      }
    }catch(e){}
  }
  return null;
}

  if(!list || list.length === 0){

    return;

    <div class="user-row">
      <div class="user-id">${u.user_id}</div>
      <div class="user-name">@${(u.username || "—")}</div>

    </div>

  `;
}

  const box = document.getElementById("usersListBox");
  if(box) box.innerHTML = `<div class="users-empty">Загрузка списка пользователей…</div>`;

  const list = await fetchUsersFromServer(scope);

          <br><br>
          <code>{ users: [{ user_id: 123, username: "name" }, ...] }</code>
        </div>

function copyUsersToClipboard(){
  const box = document.getElementById("usersListBox");
  if(!box) return;

  const rows = Array.from(box.querySelectorAll(".user-row")).map(r=>{
    const id = r.querySelector(".user-id")?.textContent?.trim() || "";
    const name = r.querySelector(".user-name")?.textContent?.trim() || "";
    return `${id}\t${name}`;
  }).filter(Boolean);

  if(rows.length === 0) return;

  const text = rows.join("\n");
  navigator.clipboard?.writeText(text).then(()=>{
    haptic("light");
  }).catch(()=>{});
}

            <path d="M8 11.5h8"></path>
            <path d="M8 14.5h5.5"></path>
          </svg>
        </div>
        <div>${f.price || "Товар"}</div>
      </div>

      <div class="price-arrow">
        <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h12"></path>
          <path d="M13 7l5 5-5 5"></path>
        </svg>
      </div>
    `;

    btn.addEventListener("click", ()=>{
      if(f.link) tg.openLink(f.link);
    });

    const star = document.createElement("button");
    star.type = "button";
    star.className = "fav-star on";
    star.innerHTML = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.5l2.8 5.8 6.4.9-4.6 4.5 1.1 6.4L12 18.6 6.3 21.1l1.1-6.4L2.8 10.2l6.4-.9L12 3.5z"></path>
      </svg>
    `;

    star.addEventListener("click", (e)=>{
      e.stopPropagation();
      const arr = getFavs().filter(x => x.id !== f.id);
      setFavs(arr);
      renderFavs();
    });

    row.appendChild(btn);
    row.appendChild(star);
    favPanel.appendChild(row);
  });

  enableRipples();
}

window.closeFavs = closeFavs;

/* Swipe-back for favorites */
(function enableFavSwipeBack(){
  let startX=0, startY=0, currentX=0;
  let isSwiping=false, locked=false;

  const swipeZone = 40;
  const threshold = 90;
  const vertTolerance = 14;

  favPanel.addEventListener("touchstart", (e)=>{
    if(favPanel.style.display !== "block") return;
    const t = e.touches[0];
    if(t.clientX > swipeZone) return;

    isSwiping = true;
    locked = false;
    startX = t.clientX;
    startY = t.clientY;
    currentX = startX;

    favPanel.style.transition = "transform .25s ease";
  }, { passive:true });

  favPanel.addEventListener("touchmove", (e)=>{
    if(!isSwiping) return;

    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;

    if(!locked){
      if(Math.abs(dy) > vertTolerance && Math.abs(dy) > Math.abs(dx)){
        isSwiping = false;
        favPanel.style.transform = "translateX(0)";
        return;
      }
      if(Math.abs(dx) > 6) locked = true;
    }

    if(dx > 0){
      e.preventDefault();
      currentX = t.clientX;
      favPanel.style.transform = `translateX(${dx}px)`;
    }
  }, { passive:false });

  favPanel.addEventListener("touchend", ()=>{
    if(!isSwiping) return;

    const dx = currentX - startX;

    if(dx > threshold){
      favPanel.style.transform = "translateX(100%)";
      setTimeout(()=>{
        closeFavs();
        favPanel.style.transition = "none";
        favPanel.style.transform = "translateX(0)";
        requestAnimationFrame(()=>{
          favPanel.style.transition = "transform .25s ease";
        });
      }, 200);
    }else{
      favPanel.style.transform = "translateX(0)";
    }

    isSwiping = false;
  }, { passive:true });
})();

loadData();
</script>
