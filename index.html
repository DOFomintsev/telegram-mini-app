<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Deal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#000;
  --card1:#1DB954;
  --card2:#16a34a;

  --glass: rgba(10,10,10,.55);
  --glassBorder: rgba(255,255,255,.08);
  --shadowDeep: 0 20px 40px rgba(0,0,0,.62);
  --shadowGlow: 0 0 60px rgba(29,185,84,.10);
  --spring: cubic-bezier(.22,1.4,.36,1);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  overflow-x:hidden;
  padding-bottom:110px; /* запас под нижнюю панель */

  /* Ultra Premium Background */
  background:
    radial-gradient(circle at 20% 30%, rgba(29,185,84,.12), transparent 42%),
    radial-gradient(circle at 80% 70%, rgba(22,163,74,.12), transparent 42%),
    radial-gradient(circle at 70% 25%, rgba(255,255,255,.05), transparent 45%),
    #000;

  background-size: 160% 160%;
  animation:bgDrift 18s ease-in-out infinite alternate;
}

@keyframes bgDrift{
  0%{ background-position: 0% 0%; }
  100%{ background-position: 100% 100%; }
}

/* subtle vignette */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.65) 100%);
  pointer-events:none;
  z-index:0;
}

/* subtle "noise" (CSS-based, no images) */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  opacity:.06;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(255,255,255,.12) 0 1px, transparent 2px),
    radial-gradient(circle at 35% 80%, rgba(255,255,255,.10) 0 1px, transparent 2px),
    radial-gradient(circle at 70% 30%, rgba(255,255,255,.09) 0 1px, transparent 2px),
    radial-gradient(circle at 85% 65%, rgba(255,255,255,.08) 0 1px, transparent 2px),
    radial-gradient(circle at 55% 50%, rgba(255,255,255,.07) 0 1px, transparent 2px);
  background-size: 180px 180px, 220px 220px, 200px 200px, 260px 260px, 240px 240px;
  filter: blur(.15px);
}

/* background parallax layer */
#bgLayer{
  position:fixed;
  inset:-40px;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 20%, rgba(29,185,84,.10), transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(22,163,74,.10), transparent 45%),
    radial-gradient(circle at 55% 40%, rgba(255,255,255,.03), transparent 55%);
  transform:translateX(0);
  transition:transform .25s ease;
}

/* Title */
h1{
  position:relative;
  z-index:2;
  text-align:center;
  padding:24px 0 10px;
  font-size:22px;
  font-weight:700;
  opacity:0;
  transform:translateY(-18px);
  animation:titleAppear .8s var(--spring) forwards;
}

@keyframes titleAppear{
  to{opacity:1;transform:translateY(0);}
}

/* Screens wrapper (for smooth transitions) */
#swipeContainer{
  position:relative;
  z-index:2;
}

/* iOS swipe perf */
.swipeable{
  transition: transform .25s ease;
  will-change: transform;
}

/* Screen transitions (categories/prices) */
.screen{
  opacity:0;
  transform:translateX(14px);
  transition:opacity .35s var(--spring), transform .35s var(--spring);
}

.screen.active{
  opacity:1;
  transform:translateX(0);
}

/* ===== Categories ===== */
.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:20px;
}

.category-card{
  position:relative;
  overflow:hidden;
  border-radius:24px;
  padding:30px 20px;
  text-align:center;
  cursor:pointer;

  /* premium depth + material */
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.14), transparent 42%),
    radial-gradient(circle at 80% 85%, rgba(0,0,0,.35), transparent 55%),
    linear-gradient(135deg,var(--card1),var(--card2));

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 1px 0 rgba(255,255,255,.06),
    0 16px 40px rgba(0,0,0,.55),
    0 0 60px rgba(29,185,84,.14);

  opacity:0;
  transform:translateY(50px) scale(.92);
  filter:blur(12px);
}

.category-card.show{
  animation:ultraAppear 1s var(--spring) forwards;
}

@keyframes ultraAppear{
  0%{opacity:0;transform:translateY(50px) scale(.92);filter:blur(12px);}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
}

.category-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top left, rgba(255,255,255,.16), transparent 60%);
  opacity:.7;
  pointer-events:none;
}

.icon{ margin-bottom:14px; }

.icon svg{
  width:46px;
  height:46px;
  stroke:rgba(255,255,255,0.92);
  fill:rgba(255,255,255,0.06);
  stroke-width:1.5;
  opacity:.95;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.32));
}

.label{
  font-size:15px;
  font-weight:650;
}

/* ===== Skeleton Loading ===== */
.skeleton{
  position:relative;
  overflow:hidden;
  border-radius:24px;
  height:108px;
  background:linear-gradient(145deg,#0f0f0f,#1a1a1a);
  border:1px solid rgba(255,255,255,.06);
  box-shadow: 0 16px 40px rgba(0,0,0,.55);
}

.skeleton::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
  transform:translateX(-35%);
  animation:skeletonShimmer 1.2s ease-in-out infinite;
}

@keyframes skeletonShimmer{
  0%{ transform:translateX(-35%); }
  100%{ transform:translateX(35%); }
}

/* ===== Prices ===== */
.prices{
  padding:20px;
  display:none;
}

.price-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

  border-radius:20px;
  padding:18px 20px;
  margin-bottom:16px;

  background:linear-gradient(145deg,#121212,#1c1c1c);
  border:1px solid rgba(255,255,255,.07);
  color:#fff;

  font-size:15px;
  font-weight:650;
  letter-spacing:.3px;

  cursor:pointer;
  position:relative;
  overflow:hidden;

  opacity:0;
  transform:translateY(14px);
  transition:all .45s var(--spring);

  box-shadow:
    0 1px 0 rgba(255,255,255,.05),
    0 14px 34px rgba(0,0,0,.6);
}

.price-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.price-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(29,185,84,.12);
  color:#1DB954;
  font-size:16px;
}

.price-arrow{
  font-size:18px;
  opacity:.4;
  transition:.35s var(--spring);
}

.price-btn:hover{
  transform:translateY(-4px);
  border-color:rgba(29,185,84,.45);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06),
    0 18px 46px rgba(0,0,0,.62),
    0 0 50px rgba(29,185,84,.12);
}

.price-btn:hover .price-arrow{
  opacity:1;
  transform:translateX(6px);
}

.price-btn:active{
  transform:scale(.97);
}

.back-btn{
  text-align:center;
  font-size:14px;
  opacity:.65;
  margin-top:6px;
  cursor:pointer;
}

/* ===============================
   BOTTOM ACTIONS — PREMIUM GLASS
   =============================== */

.bottom-actions{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%) translateY(30px);
  width:92%;
  max-width:440px;

  display:flex;
  flex-direction:column;
  gap:14px;

  opacity:0;
  transition:.65s var(--spring);
  z-index:50;

  /* glass panel */
  background: var(--glass);
  border:1px solid var(--glassBorder);
  border-radius:22px;
  padding:14px;

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  box-shadow:
    0 1px 0 rgba(255,255,255,.06),
    var(--shadowDeep),
    var(--shadowGlow);
}

.bottom-actions.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.bottom-actions.hidden{
  opacity:0 !important;
  transform:translateX(-50%) translateY(30px) !important;
  pointer-events:none !important;
}

/* Signature (gold, subtle) */
.signature-wrapper{
  text-align:center;
  opacity:0;
  transform:translateY(6px);
  transition:.85s var(--spring);
}

.bottom-actions.show .signature-wrapper{
  opacity:1;
  transform:translateY(0);
}

.signature{
  font-size:12px;
  letter-spacing:.8px;
  font-family:"Brush Script MT","Segoe Script",cursive;

  background:linear-gradient(
    110deg,
    #8f6b1f 0%,
    #d4af37 25%,
    #f6e27a 45%,
    #ffffff 50%,
    #f6e27a 55%,
    #d4af37 75%,
    #8f6b1f 100%
  );

  background-size:250% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  animation:goldShimmer 6s linear infinite;

  text-shadow:
    0 0 4px rgba(212,175,55,.35),
    0 0 10px rgba(212,175,55,.12);
}

.signature-line{
  margin:6px auto 0;
  width:124px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(212,175,55,.9), transparent);
  box-shadow:0 0 10px rgba(212,175,55,.35);
  opacity:.85;
}

@keyframes goldShimmer{
  from{ background-position:0% center; }
  to{ background-position:250% center; }
}

.bottom-buttons{
  width:100%;
  display:flex;
  flex-direction:row;
  gap:12px;
}

.bottom-buttons .action-btn{
  flex:1;
  min-width:0;
}

/* Buttons (premium + ripple support) */
.action-btn{
  position:relative;
  overflow:hidden;

  padding:13px 16px;
  font-size:14px;
  font-weight:650;
  border-radius:18px;
  cursor:pointer;

  border:1px solid rgba(255,255,255,.10);
  color:#fff;

  background:linear-gradient(145deg,#121212,#1c1c1c);

  box-shadow:
    0 1px 0 rgba(255,255,255,.05),
    0 14px 34px rgba(0,0,0,.62);

  transition:all .5s var(--spring);
}

.action-btn:hover{
  transform:translateY(-3px);
  border-color:rgba(29,185,84,.35);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06),
    0 18px 46px rgba(0,0,0,.65),
    0 0 50px rgba(29,185,84,.10);
}

.action-btn:active{
  transform:scale(.96);
}

.action-btn.primary{
  border:none;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.14), transparent 45%),
    linear-gradient(135deg,var(--card1),var(--card2));
  box-shadow:
    0 1px 0 rgba(255,255,255,.08),
    0 18px 46px rgba(0,0,0,.65),
    0 0 70px rgba(29,185,84,.16);
}

/* Ripple element */
.ripple{
  position:absolute;
  border-radius:999px;
  transform:scale(0);
  opacity:.35;
  background:rgba(255,255,255,.65);
  pointer-events:none;
  animation:ripple .6s ease-out forwards;
}

@keyframes ripple{
  to{ transform:scale(3.2); opacity:0; }
}

/* ===== Admin ===== */

.admin-btn{
  position:fixed;
  top:18px !important;
  right:18px !important;
  z-index:1001;

  background:rgba(15,15,15,.8);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 14px 34px rgba(0,0,0,.62);
}

.admin-panel{
  position:fixed;
  inset:0;
  background:#000;
  padding:25px;
  overflow-y:auto;
  display:none;
  z-index:1000;
}

.admin-card{
  background:linear-gradient(145deg,#0f0f0f,#161616);
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 1px 0 rgba(255,255,255,.05),
    0 16px 40px rgba(0,0,0,.58);
}

.admin-panel .close-x{
  position:fixed;
  top:18px;
  right:18px;
  z-index:1002;

  background:rgba(15,15,15,.8);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

/* reduce motion (optional, respectful) */
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

<body>
<div id="bgLayer"></div>

<h1>Smart Deal</h1>

<!-- Screens (only) -->
<div id="swipeContainer" class="swipeable">
  <div class="categories screen active" id="categories"></div>
  <div class="prices screen" id="prices"></div>
</div>

<!-- Bottom premium panel -->
<div class="bottom-actions" id="bottomActions">
  <div class="signature-wrapper">
    <div class="signature">Design and Developed by Fomintsev Denis</div>
    <div class="signature-line"></div>
  </div>

  <div class="bottom-buttons">
    <button class="action-btn primary" onclick="openFeedback()">💬 Обратная связь</button>
    <button class="action-btn outline" onclick="openSite()">🌐 Зайти на сайт</button>
  </div>
</div>

<button id="adminBtn" class="admin-btn" style="display:none;">⚙</button>
<div id="adminPanel" class="admin-panel"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const ADMIN_ID = 929524875;

/* ===== SERVER ANALYTICS ===== */
const ANALYTICS_URL = "https://script.google.com/macros/s/AKfycbxcIbUNFvrbt1BMSTPsAt6X7WBf44PXaDoSBu8x5PyqkwndQZVa2w2180AYaYQrRx7y/exec";

function sendAnalytics(data){
  fetch(ANALYTICS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  }).catch(()=>{});
}

const user = tg.initDataUnsafe?.user;
const isAdmin = user && user.id === ADMIN_ID;
if(isAdmin) document.getElementById("adminBtn").style.display="block";

function haptic(type="light"){
  if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type);
}

function openFeedback(){
  haptic("medium");
  tg.openTelegramLink("https://t.me/DFomintsev");
}

function openSite(){
  haptic("medium");
  tg.openLink("https://niceprice.pro", { try_instant_view: false });
}

/* ===== Bottom panel show/hide ===== */
function hideBottom(){
  document.getElementById("bottomActions")?.classList.add("hidden");
}
function showBottom(){
  document.getElementById("bottomActions")?.classList.remove("hidden");
}

/* ===== Ripple for premium tap ===== */
function addRippleToButtons(){
  document.querySelectorAll(".action-btn, .price-btn").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size/2;
      const y = e.clientY - rect.top - size/2;

      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = x + "px";
      ripple.style.top = y + "px";

      btn.appendChild(ripple);
      setTimeout(()=> ripple.remove(), 650);
    }, { passive:true });
  });
}

/* ===== LOCAL STATS (fallback) ===== */
let stats = JSON.parse(localStorage.getItem("smartDealStats")) || {
  launches:0,
  users:[],
  categories:{},
  products:{}
};

stats.launches++;
sendAnalytics({
  user_id: user?.id || 0,
  username: user?.username || "",
  action: "launch"
});

if(user && !stats.users.includes(user.id)) stats.users.push(user.id);
localStorage.setItem("smartDealStats", JSON.stringify(stats));

/* ===== Google Sheets ===== */
const SHEET_URL="https://docs.google.com/spreadsheets/d/1-JYl4b-6H_iWvBS2Zsez1K1DPx35iBUCCPPRiSrVY7o/export?format=csv";
let data = {};

/* ===== Skeleton Loading ===== */
function renderSkeleton(){
  const container = document.getElementById("categories");
  container.innerHTML = "";
  container.style.display = "grid";
  for(let i=0;i<6;i++){
    const sk = document.createElement("div");
    sk.className = "skeleton";
    container.appendChild(sk);
  }
}

async function loadData(){
  renderSkeleton();

  const response = await fetch(SHEET_URL);
  const text = await response.text();

  // NOTE: это упрощённый разбор CSV. Для 100% надёжности лучше перейти на JSON API.
  const rows = text.split("\n").slice(1);

  rows.forEach(rawRow=>{
    const row = rawRow.trim();
    if(!row) return;

    const parts = row.split(",");
    const category = (parts[0] || "").trim();
    const price = (parts[1] || "").trim();
    const link = (parts.slice(2).join(",") || "").trim();

    if(!category) return;
    if(!data[category]) data[category] = [];
    data[category].push({ price, link });
  });

  renderCategories();

  setTimeout(()=>{
    document.getElementById("bottomActions").classList.add("show");
  }, 650);
}

/* ===== Icons ===== */
function getIcon(category){
  if(category==="Смартфоны"){
    return `<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>`;
  }
  if(category==="Ноутбуки"){
    return `<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="10" rx="2"/><line x1="2" y1="17" x2="22" y2="17"/></svg>`;
  }
  if(category==="Планшеты"){
    return `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="17" r="0.7"/></svg>`;
  }
  if(category==="Телевизоры"){
    return `<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;
  }
  return "";
}

/* ===== Navigation helpers ===== */
function setActiveScreen(which){
  const categoriesEl = document.getElementById("categories");
  const pricesEl = document.getElementById("prices");

  if(which === "categories"){
    categoriesEl.style.display = "grid";
    pricesEl.style.display = "none";
    categoriesEl.classList.add("active");
    pricesEl.classList.remove("active");
    showBottom();
  } else {
    categoriesEl.style.display = "none";
    pricesEl.style.display = "block";
    pricesEl.classList.add("active");
    categoriesEl.classList.remove("active");
    hideBottom();
  }
}

/* ===== Categories ===== */
function renderCategories(){
  const container = document.getElementById("categories");
  container.innerHTML = "";
  setActiveScreen("categories");

  Object.keys(data).forEach((category,index)=>{
    const div = document.createElement("div");
    div.className = "category-card";
    div.innerHTML = `
      <div class="icon">${getIcon(category)}</div>
      <div class="label">${category}</div>
    `;

    div.onclick = ()=>{
      if(!stats.categories[category]) stats.categories[category]=0;
      stats.categories[category]++;

      sendAnalytics({
        user_id: user?.id || 0,
        username: user?.username || "",
        action: "category_click",
        category
      });

      localStorage.setItem("smartDealStats", JSON.stringify(stats));
      showPrices(category);
    };

    container.appendChild(div);
    setTimeout(()=>div.classList.add("show"), index*120);
  });

  // add ripple to category cards too (optional premium)
  setTimeout(addRippleToButtons, 0);
}

/* ===== Prices ===== */
function showPrices(category){
  const pricesDiv = document.getElementById("prices");
  haptic("medium");
  setActiveScreen("prices");

  pricesDiv.innerHTML = "";

  (data[category] || []).forEach((item,index)=>{
    const btn=document.createElement("button");
    btn.className="price-btn";
    btn.innerHTML = `
      <div class="price-left">
        <div class="price-icon">💰</div>
        <div>${item.price || ""}</div>
      </div>
      <div class="price-arrow">→</div>
    `;

    btn.onclick=()=>{
      const key = category+" | "+(item.price || "");
      if(!stats.products[key]) stats.products[key]=0;
      stats.products[key]++;

      sendAnalytics({
        user_id: user?.id || 0,
        username: user?.username || "",
        action: "product_click",
        category,
        product: item.price,
        price: item.price
      });

      localStorage.setItem("smartDealStats", JSON.stringify(stats));
      const url = (item.link || "").trim();
      if(url) tg.openLink(url);
    };

    pricesDiv.appendChild(btn);

    setTimeout(()=>{
      btn.style.opacity="1";
      btn.style.transform="translateY(0)";
    },index*70);
  });

  const back=document.createElement("div");
  back.className="back-btn";
  back.innerText="← Назад";
  back.onclick=()=>{
    setActiveScreen("categories");
    renderCategories();
  };

  pricesDiv.appendChild(back);

  setTimeout(addRippleToButtons, 0);
}

/* ===== Admin Panel (server) ===== */
document.getElementById("adminBtn").onclick = async () => {
  const panel = document.getElementById("adminPanel");
  panel.style.display = "block";
  panel.innerHTML = `<button class="close-x" onclick="closeAdmin()">✕</button>Загрузка...`;
  hideBottom();

  try{
    const response = await fetch(ANALYTICS_URL);
    const s = await response.json();

    const conversion = s.launches > 0
      ? ((s.product_clicks / s.launches) * 100).toFixed(1)
      : 0;

    panel.innerHTML = `
      <button class="close-x" onclick="closeAdmin()">✕</button>
      <h2 style="margin-bottom:20px;">📊 Smart Deal Admin 3.0</h2>

      <div class="admin-card">🚀 Всего запусков: <b>${s.launches}</b></div>
      <div class="admin-card">👤 Всего пользователей: <b>${s.unique_users}</b></div>
      <div class="admin-card">🛒 Всего кликов: <b>${s.product_clicks}</b></div>
      <div class="admin-card">📈 Общая конверсия: <b>${conversion}%</b></div>

      <h3 style="margin-top:25px;">📅 Сегодня</h3>
      <div class="admin-card">🚀 Запусков сегодня: <b>${s.today_launches}</b></div>
      <div class="admin-card">👤 Новых сегодня: <b>${s.today_users}</b></div>
      <div class="admin-card">🛒 Кликов сегодня: <b>${s.today_product_clicks}</b></div>

      <h3 style="margin-top:25px;">🔥 Топ категории</h3>
      ${renderTop(s.top_categories)}

      <h3 style="margin-top:25px;">💰 Топ товары</h3>
      ${renderTop(s.top_products)}
    `;
  } catch(e){
    panel.innerHTML = `<button class="close-x" onclick="closeAdmin()">✕</button>Ошибка загрузки данных`;
  }
};

function renderTop(obj){
  if(!obj || Object.keys(obj).length === 0){
    return '<div class="admin-card">Нет данных</div>';
  }
  const total = Object.values(obj).reduce((a,b)=>a+b,0);

  return Object.entries(obj)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3)
    .map((item,i)=>{
      const percent = total > 0 ? ((item[1] / total) * 100).toFixed(1) : "0.0";
      return `
        <div class="admin-card">
          ${i+1}. ${item[0]}<br>
          <small>${item[1]} кликов (${percent}%)</small>
        </div>
      `;
    })
    .join("");
}

function closeAdmin(){
  document.getElementById("adminPanel").style.display="none";
  // возвращаем нижнюю панель только если на категориях
  const pricesVisible = document.getElementById("prices").style.display === "block";
  if(!pricesVisible) showBottom();
}

/* ===== SWIPE BACK SYSTEM (with scroll-safe dx/dy) ===== */
let startX = 0, startY = 0;
let currentX = 0;
let isSwiping = false;
const swipeZone = 40;
const threshold = 90;

const swipeContainer = document.getElementById("swipeContainer");
const bgLayer = document.getElementById("bgLayer");

swipeContainer.addEventListener("touchstart", e => {
  if(document.getElementById("prices").style.display !== "block") return;
  const t = e.touches[0];

  if(t.clientX < swipeZone){
    isSwiping = true;
    startX = t.clientX;
    startY = t.clientY;
    currentX = startX;
  }
}, { passive:true });

swipeContainer.addEventListener("touchmove", e => {
  if(!isSwiping) return;

  const t = e.touches[0];
  currentX = t.clientX;

  const dx = Math.abs(t.clientX - startX);
  const dy = Math.abs(t.clientY - startY);

  // если это скорее вертикальный скролл — игнорируем свайп
  if(dy > dx) return;

  const diff = currentX - startX;
  if(diff > 0){
    swipeContainer.style.transform = `translateX(${diff}px)`;

    // subtle parallax
    bgLayer.style.transform = `translateX(${diff * 0.18}px)`;
  }
}, { passive:true });

swipeContainer.addEventListener("touchend", () => {
  if(!isSwiping) return;

  const diff = currentX - startX;

  if(diff > threshold){
    swipeContainer.style.transform = "translateX(100%)";
    bgLayer.style.transform = "translateX(18px)";

    setTimeout(()=>{
      setActiveScreen("categories");
      renderCategories();

      swipeContainer.style.transition="none";
      swipeContainer.style.transform="translateX(0)";
      bgLayer.style.transition="none";
      bgLayer.style.transform="translateX(0)";

      setTimeout(()=>{
        swipeContainer.style.transition="transform .25s ease";
        bgLayer.style.transition="transform .25s ease";
      }, 40);
    }, 200);
  } else {
    swipeContainer.style.transform = "translateX(0)";
    bgLayer.style.transform = "translateX(0)";
  }

  isSwiping = false;
});

/* init */
loadData();
</script>
