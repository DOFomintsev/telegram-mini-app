// + Список UserID и UserName //

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Deal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#000000;
  --card1:#1DB954;
  --card2:#16a34a;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  color:#fff;
  overflow-x:hidden;
  padding-bottom:90px;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  pointer-events:none;
}

h1{
  text-align:center;
  padding:24px 0 10px;
  font-size:22px;
  font-weight:700;
  opacity:0;
  transform:translateY(-20px);
  animation:titleAppear .8s ease forwards;
}

@keyframes titleAppear{
  to{opacity:1;transform:translateY(0);}
}

/* ===== Категории ===== */

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:20px;
}

.category-card{
  background:linear-gradient(135deg,var(--card1),var(--card2));
  border-radius:24px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 12px 35px rgba(29,185,84,0.35);
  cursor:pointer;
  position:relative;
  overflow:hidden;
  opacity:0;
  transform:translateY(50px) scale(.9);
  filter:blur(14px);
}

.category-card.show{
  animation:ultraAppear 1s cubic-bezier(.22,1,.36,1) forwards;
}

@keyframes ultraAppear{
  0%{opacity:0;transform:translateY(50px) scale(.9);filter:blur(14px);}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
}

.category-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top left, rgba(255,255,255,.18), transparent 60%);
  opacity:.6;
}

.icon{ margin-bottom:14px; }

.icon svg{
  width:46px;
  height:46px;
  stroke:rgba(255,255,255,.92);
  fill:rgba(255,255,255,.06);
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.22));
}

.label{
  font-size:15px;
  font-weight:600;
}

/* ===== Цены ===== */

.prices{
  display:none;
  padding:20px;
}

.price-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

  background:linear-gradient(145deg,#121212,#1c1c1c);
  border:1px solid rgba(255,255,255,.06);
  color:#fff;
  padding:18px 20px;
  margin-bottom:16px;
  border-radius:20px;
  font-size:15px;
  font-weight:600;
  letter-spacing:.3px;
  cursor:pointer;
  position:relative;
  overflow:hidden;

  opacity:0;
  transform:translateY(15px);
  transition:all .35s cubic-bezier(.22,1,.36,1);

  box-shadow:
    0 8px 25px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.price-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.price-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(29,185,84,.12);
  color:#1DB954;
  font-size:16px;
}

.price-arrow{
  font-size:18px;
  opacity:.4;
  transition:.3s;
}

.price-btn:hover{
  transform:translateY(-4px);
  border-color:rgba(29,185,84,.5);
  box-shadow:
    0 15px 40px rgba(29,185,84,.25),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.price-btn:hover .price-arrow{
  opacity:1;
  transform:translateX(6px);
}

.price-btn:active{ transform:scale(.97); }

.back-btn{
  text-align:center;
  font-size:14px;
  opacity:.6;
  margin-top:6px;
  cursor:pointer;
}

/* ===== iOS Swipe Back ===== */

.swipeable{
  transition: transform .25s ease;
  will-change: transform;
}

/* ===============================
   BOTTOM ACTIONS — CLEAN VERSION
   =============================== */

.bottom-actions{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%) translateY(30px);
  width:90%;
  max-width:420px;

  display:flex;
  flex-direction:column;
  gap:14px;

  opacity:0;
  transition:.6s cubic-bezier(.22,1,.36,1);
  z-index:50;
}

.bottom-actions.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.bottom-actions.hidden{
  opacity:0 !important;
  transform:translateX(-50%) translateY(30px) !important;
  pointer-events:none !important;
}

/* Signature (gold) */

.signature-wrapper{
  text-align:center;
  opacity:0;
  transform:translateY(6px);
  transition:.8s cubic-bezier(.22,1,.36,1);
}

.bottom-actions.show .signature-wrapper{
  opacity:1;
  transform:translateY(0);
}

.signature{
  font-size:12px;
  letter-spacing:.8px;
  font-family:"Brush Script MT","Segoe Script",cursive;

  background:linear-gradient(
    110deg,
    #8f6b1f 0%,
    #d4af37 25%,
    #f6e27a 45%,
    #ffffff 50%,
    #f6e27a 55%,
    #d4af37 75%,
    #8f6b1f 100%
  );

  background-size:250% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  animation:goldShimmer 6s linear infinite;

  text-shadow:
    0 0 4px rgba(212,175,55,.35),
    0 0 10px rgba(212,175,55,.15);
}

.signature-line{
  margin:6px auto 0;
  width:120px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(212,175,55,.9), transparent);
  box-shadow:0 0 8px rgba(212,175,55,.4);
  opacity:.8;
}

@keyframes goldShimmer{
  from{ background-position:0% center; }
  to{ background-position:250% center; }
}

/* Buttons row */

.bottom-buttons{
  width:100%;
  display:flex;
  flex-direction:row;
  gap:12px;
}

.bottom-buttons .action-btn{
  flex:1;
  min-width:0;
  white-space:nowrap;        /* ✅ запрет переноса */
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Base button */

.action-btn{
  padding:13px 16px;
  font-size:14px;
  font-weight:600;
  border-radius:18px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
  color:#fff;

  background:linear-gradient(145deg,#121212,#1c1c1c);
  box-shadow:
    0 8px 25px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.05);

  transition:all .35s cubic-bezier(.22,1,.36,1);
}

.action-btn:hover{
  transform:translateY(-3px);
  border-color:rgba(29,185,84,.4);
  box-shadow:
    0 15px 40px rgba(29,185,84,.25),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.action-btn:active{ transform:scale(.96); }

/* Accent button */

.action-btn.primary{
  border:none;
  background:linear-gradient(135deg,var(--card1),var(--card2));
  box-shadow:0 10px 30px rgba(29,185,84,.35);
}

.action-btn.primary:hover{
  box-shadow:0 15px 40px rgba(29,185,84,.45);
}

/* ===== Button Content Layout Fix ===== */
.btn-content{
  display:inline-flex;
  align-items:center;
  gap:10px;
  justify-content:center;
  white-space:nowrap;
}

/* ===== Admin ===== */

.admin-btn{
  position:fixed;
  top:18px !important;
  right:18px !important;
  z-index:1001; /* ✅ выше bottom-actions (50) и panel (1000) */
  background:#111;
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
}

.admin-panel{
  position:fixed;
  inset:0;
  background:#000;
  padding:25px;
  overflow-y:auto;
  display:none;
  z-index:1000;
}

.admin-card{
  background:#111;
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,.08);
}

.admin-panel .close-x{
  position:fixed;
  top:18px;
  right:18px;
  z-index:1002;
  background:#111;
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
}
/* ===== Apple Glass Upgrade (Index 18) ===== */

/* Safe-area (iPhone) + glass look */
.bottom-actions{
  bottom: calc(18px + env(safe-area-inset-bottom));
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
  padding-left:14px;
  padding-right:14px;

  background: rgba(12,12,12,.45); /* чуть легче */
  border: none; /* ❌ убираем рамку */
  border-radius: 22px;

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  box-shadow:
    0 20px 60px rgba(0,0,0,.65),
    0 0 50px rgba(29,185,84,.08);
}

/* Buttons: slightly more “springy” */
.action-btn,
.price-btn{
  transition: all .45s cubic-bezier(.22,1.4,.36,1);
}

/* Cards: material highlight */
.category-card{
  border: 1px solid rgba(255,255,255,.08);
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.14), transparent 45%),
    radial-gradient(circle at 80% 85%, rgba(0,0,0,.35), transparent 55%),
    linear-gradient(135deg,var(--card1),var(--card2));
}

/* ===== Skeleton loading ===== */
.skeleton{
  height:112px;
  border-radius:24px;
  background: linear-gradient(145deg,#0f0f0f,#1a1a1a);
  border:1px solid rgba(255,255,255,.06);
  box-shadow: 0 14px 40px rgba(0,0,0,.6);
  position:relative;
  overflow:hidden;
}

.skeleton::after{
  content:"";
  position:absolute;
  inset:-60%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
  transform: translateX(-35%);
  animation: skeletonShimmer 1.15s ease-in-out infinite;
}

@keyframes skeletonShimmer{
  0%{ transform:translateX(-35%); }
  100%{ transform:translateX(35%); }
}

/* ===== Ripple effect ===== */
.ripple{
  position:absolute;
  border-radius:999px;
  transform:scale(0);
  opacity:.35;
  background:rgba(255,255,255,.70);
  pointer-events:none;
  animation:ripple .6s ease-out forwards;
}

@keyframes ripple{
  to{ transform:scale(3.2); opacity:0; }
}
/* ===== Premium Icon System ===== */
:root{
  --iconStroke: rgba(255,255,255,.92);
  --iconFill: rgba(255,255,255,.06);
  --iconStrokeW: 1.7;
}

.picon{
  width:46px;
  height:46px;
  stroke:var(--iconStroke);
  fill:var(--iconFill);
  stroke-width:var(--iconStrokeW);
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.22));
}

.picon-sm{
  width:18px;
  height:18px;
  stroke:var(--iconStroke);
  fill:none;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.92;
}

/* Иконка в price-icon вместо эмодзи */
.price-icon{
  background:rgba(29,185,84,.12);
  color:transparent; /* на всякий случай, если текст останется */
}
/* ===== 3D Arrow for Price Cards (Index 20) ===== */

/* превращаем правую часть в объёмную /* ===== Smaller Arrow (50% size) ===== */

.price-arrow{
  width:17px;
  height:17px;
  border-radius:6px;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:1;
  transition:all .35s cubic-bezier(.22,1,.36,1);

  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.16), transparent 55%),
    linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -4px 8px rgba(0,0,0,.35),
    0 4px 10px rgba(0,0,0,.5);
}
.price-arrow svg{
  width:10px;
  height:10px;
}
/* “объём” самой SVG-стрелки */
.price-arrow svg{
  filter:
    drop-shadow(0 2px 0 rgba(0,0,0,.55))
    drop-shadow(0 0 8px rgba(29,185,84,.18));
  transform: translateY(-.5px);
}

/* hover: капсула чуть приподнимается и наклоняется */
.price-btn:hover .price-arrow{
  transform: translateY(-2px) rotateX(8deg);
  border-color: rgba(29,185,84,.35);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -12px 20px rgba(0,0,0,.38),
    0 14px 28px rgba(29,185,84,.18),
    0 18px 40px rgba(0,0,0,.55);
}

/* tap: “нажатие” */
.price-btn:active .price-arrow{
  transform: translateY(0) scale(.96);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -14px 22px rgba(0,0,0,.45),
    0 8px 18px rgba(0,0,0,.55);
}

/* ===== Admin Users Buttons + List ===== */
.admin-card.clickable{
  cursor:pointer;
  transition:all .25s cubic-bezier(.22,1,.36,1);
}

.admin-card.clickable:hover{
  transform:translateY(-2px);
  border-color:rgba(29,185,84,.35);
  box-shadow:0 14px 36px rgba(29,185,84,.12);
}

.users-box{
  margin-top:14px;
}

.users-toolbar{
  display:flex;
  gap:10px;
  margin:10px 0 12px;
}

.users-toolbar button{
  flex:1;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(145deg,#0f0f0f,#171717);
  color:#fff;
  cursor:pointer;
}

.users-list{
  background:linear-gradient(145deg,#0f0f0f,#171717);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:12px;
}

.user-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:13px;
}

.user-row:last-child{ border-bottom:none; }

.user-id{
  opacity:.9;
  font-variant-numeric: tabular-nums;
}

.user-name{
  opacity:.75;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:55%;
  text-align:right;
}

.users-empty{
  opacity:.75;
  font-size:13px;
  line-height:1.5;
}
  
</style>
</head>

<body>

<h1>Smart Deal</h1>

<!-- ✅ swipeContainer содержит ТОЛЬКО экраны -->
<div id="swipeContainer" class="swipeable">
  <div class="categories" id="categories"></div>
  <div class="prices" id="prices"></div>
</div>

<!-- ✅ Нижняя панель отдельно, НЕ внутри swipeContainer -->
<div class="bottom-actions" id="bottomActions">
  <div class="signature-wrapper">
    <div class="signature">Design and Developed by Fomintsev Denis</div>
    <div class="signature-line"></div>
  </div>

  <div class="bottom-buttons">
    <button class="action-btn outline" onclick="openFeedback()">
  <span class="btn-content">
    <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 12c0 3.9-3.6 7-8 7-1 0-2-.1-2.9-.4L5 20l1-3.2C4.8 15.7 4 13.9 4 12c0-3.9 3.6-7 8-7s8 3.1 8 7z"></path>
      <path d="M8 11.5h8"></path>
      <path d="M8 14.5h5.5"></path>
    </svg>
    <span>Обратная связь</span>
  </span>
</button>

<button class="action-btn outline" onclick="openSite()">
  <span class="btn-content">
    <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5"></circle>
      <path d="M3.8 12h16.4"></path>
      <path d="M12 3.5c2.2 2.3 3.5 5.2 3.5 8.5S14.2 18.2 12 20.5c-2.2-2.3-3.5-5.2-3.5-8.5S9.8 5.8 12 3.5z"></path>
    </svg>
    <span>Зайти на сайт</span>
  </span>
</button>
  </div>
</div>

<!-- ✅ Админ-кнопка отдельно, фиксирована и над всем -->
<button id="adminBtn" class="admin-btn" style="display:none;">⚙</button>
<div id="adminPanel" class="admin-panel"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const ADMIN_ID = 929524875;

/* ===== SERVER ANALYTICS ===== */
const ANALYTICS_URL = "https://script.google.com/macros/s/AKfycbxcIbUNFvrbt1BMSTPsAt6X7WBf44PXaDoSBu8x5PyqkwndQZVa2w2180AYaYQrRx7y/exec";

function sendAnalytics(data){
  fetch(ANALYTICS_URL,{ method:"POST", body:JSON.stringify(data) }).catch(()=>{});
}

const user = tg.initDataUnsafe?.user;
const isAdmin = user && user.id === ADMIN_ID;

if(isAdmin){
  document.getElementById("adminBtn").style.display="block";
}

function haptic(type="light"){
  if(tg.HapticFeedback){
    tg.HapticFeedback.impactOccurred(type);
  }
}

function openFeedback(){
  haptic("medium");
  tg.openTelegramLink("https://t.me/DFomintsev");
}

function openSite(){
  haptic("medium");
  tg.openLink("https://niceprice.pro", { try_instant_view: false });
}

/* ===== Bottom panel show/hide ===== */
function hideBottom(){
  document.getElementById("bottomActions")?.classList.add("hidden");
}
function showBottom(){
  document.getElementById("bottomActions")?.classList.remove("hidden");
}

/* ===== LOCAL STATS (fallback) ===== */
let stats = JSON.parse(localStorage.getItem("smartDealStats")) || {
  launches:0,
  users:[],
  categories:{},
  products:{}
};

stats.launches++;
sendAnalytics({
  user_id: user?.id || 0,
  username: user?.username || "",
  action: "launch"
});

if(user && !stats.users.includes(user.id)){
  stats.users.push(user.id);
}
localStorage.setItem("smartDealStats", JSON.stringify(stats));

/* ===== Google Sheets ===== */
const SHEET_URL="https://docs.google.com/spreadsheets/d/1-JYl4b-6H_iWvBS2Zsez1K1DPx35iBUCCPPRiSrVY7o/export?format=csv";
let data = {};

async function loadData(){
  renderSkeleton();
  const response = await fetch(SHEET_URL);
  const text = await response.text();
  const rows = text.split("\n").slice(1);

  rows.forEach(rawRow=>{
    const row = rawRow.trim();
    if(!row) return;

    // ✅ чуть безопаснее: link собираем из "остатка", если там были запятые
    const parts = row.split(",");
    const category = (parts[0] || "").trim();
    const price = (parts[1] || "").trim();
    const link = parts.slice(2).join(",").trim();

    if(!category) return;
    if(!data[category]) data[category] = [];
    data[category].push({ price, link });
  });

  renderCategories();
  enableRipples();
  setTimeout(()=>{
    document.getElementById("bottomActions").classList.add("show");
  }, 700);
}

/* ===== Icons ===== */
function getIcon(category){
  const icons = {
    "Смартфоны": `
      <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="2.2"></rect>
        <line x1="10" y1="5.5" x2="14" y2="5.5"></line>
        <circle cx="12" cy="18.2" r="0.9" fill="none"></circle>
      </svg>
    `,
    "Ноутбуки": `
      <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="6" width="14" height="9" rx="2"></rect>
        <path d="M3.5 17.2h17"></path>
        <path d="M8 17.2l.8 1.6h6.4l.8-1.6"></path>
      </svg>
    `,
    "Планшеты": `
      <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="3.2" width="12" height="17.6" rx="2.2"></rect>
        <circle cx="12" cy="17.8" r="0.9" fill="none"></circle>
      </svg>
    `,
    "Телевизоры": `
      <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="6" width="16" height="10" rx="2.2"></rect>
        <path d="M9 20h6"></path>
        <path d="M12 16v4"></path>
      </svg>
    `
  };

  return icons[category] || `
    <svg class="picon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8"></circle>
      <path d="M9.5 12h5"></path>
    </svg>
  `;
}

/* ===== Categories ===== */
function renderCategories(){
  const container = document.getElementById("categories");
  container.innerHTML = "";
  container.style.display = "grid";
  showBottom(); // ✅ на главном экране панель показываем

  Object.keys(data).forEach((category,index)=>{
    const div = document.createElement("div");
    div.className = "category-card";

    div.innerHTML = `
      <div class="icon">${getIcon(category)}</div>
      <div class="label">${category}</div>
    `;

    div.onclick = ()=>{
      if(!stats.categories[category]) stats.categories[category]=0;
      stats.categories[category]++;

      sendAnalytics({
        user_id: user?.id || 0,
        username: user?.username || "",
        action: "category_click",
        category
      });

      localStorage.setItem("smartDealStats", JSON.stringify(stats));
      showPrices(category);
    };

    container.appendChild(div);
    setTimeout(()=>div.classList.add("show"), index*140);
  });
}

function showPrices(category){
  const categoriesBlock = document.getElementById("categories");
  const pricesDiv = document.getElementById("prices");

  haptic("medium");
  hideBottom(); // ✅ чтобы не перекрывало цены

  categoriesBlock.style.display="none";
  pricesDiv.style.display="block";
  pricesDiv.innerHTML="";

  (data[category] || []).forEach((item,index)=>{
    const btn=document.createElement("button");
    btn.className="price-btn";
    btn.innerHTML = `
  <div class="price-left">
    <div class="price-icon">
      <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 8.5c0-1.9 1.7-3.5 5-3.5s5 1.2 5 3.1-1.4 2.5-5 2.9-5 1.1-5 2.9 1.7 3.1 5 3.1 5-1.6 5-3.5"></path>
        <path d="M12 4v16"></path>
      </svg>
    </div>
    <div>${item.price || ""}</div>
  </div>
  <div class="price-arrow">
    <svg class="picon-sm" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 12h12"></path>
      <path d="M13 7l5 5-5 5"></path>
    </svg>
  </div>
`;

    btn.onclick=()=>{
      const key=category+" | "+(item.price || "");
      if(!stats.products[key]) stats.products[key]=0;
      stats.products[key]++;

      sendAnalytics({
        user_id: user?.id || 0,
        username: user?.username || "",
        action: "product_click",
        category,
        product: item.price,
        price: item.price
      });

      localStorage.setItem("smartDealStats", JSON.stringify(stats));
      if(item.link) tg.openLink(item.link);
    };

    pricesDiv.appendChild(btn);

    setTimeout(()=>{
      btn.style.opacity="1";
      btn.style.transform="translateY(0)";
    },index*80);
  });

  const back=document.createElement("div");
  back.className="back-btn";
  back.innerText="← Назад";
  back.onclick=()=>{
    pricesDiv.style.display="none";
    categoriesBlock.style.display="grid";
    renderCategories();
    showBottom();
  };

  pricesDiv.appendChild(back);
  enableRipples();
}

function renderTop(obj){
  if(!obj || Object.keys(obj).length === 0){
    return '<div class="admin-card">Нет данных</div>';
  }

  const total = Object.values(obj).reduce((a,b)=>a+b,0);

  return Object.entries(obj)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3)
    .map((item,i)=>{
      const percent = total > 0 ? ((item[1] / total) * 100).toFixed(1) : "0.0";
      return `
        <div class="admin-card">
          ${i+1}. ${item[0]}<br>
          <small>${item[1]} кликов (${percent}%)</small>
        </div>
      `;
    })
    .join("");
}

}

/* ===== SWIPE BACK SYSTEM ===== */
let startX = 0;
let currentX = 0;
let isSwiping = false;
const swipeZone = 40; // зона от левого края
const threshold = 90; // сколько нужно провести

const swipeContainer = document.getElementById("swipeContainer");

swipeContainer.addEventListener("touchstart", e => {
  if(document.getElementById("prices").style.display !== "block") return;

  if(e.touches[0].clientX < swipeZone){
    isSwiping = true;
    startX = e.touches[0].clientX;
    currentX = startX; // ✅ фикс: если не было touchmove
  }
});

swipeContainer.addEventListener("touchmove", e => {
  if(!isSwiping) return;

  currentX = e.touches[0].clientX;
  const diff = currentX - startX;

  if(diff > 0){
    swipeContainer.style.transform = `translateX(${diff}px)`;
  }
});

swipeContainer.addEventListener("touchend", () => {
  if(!isSwiping) return;

  const diff = currentX - startX;

  if(diff > threshold){
    swipeContainer.style.transform = "translateX(100%)";

    setTimeout(()=>{
      document.getElementById("prices").style.display="none";
      document.getElementById("categories").style.display="grid";
      renderCategories();
      showBottom();

      swipeContainer.style.transition="none";
      swipeContainer.style.transform="translateX(0)";
      setTimeout(()=>{ swipeContainer.style.transition=".25s ease"; },50);
    },200);
  } else {
    swipeContainer.style.transform = "translateX(0)";
  }

  isSwiping = false;
});
function renderSkeleton(){
  const container = document.getElementById("categories");
  container.innerHTML = "";
  container.style.display = "grid";
  for(let i=0;i<4;i++){
    const sk = document.createElement("div");
    sk.className = "skeleton";
    container.appendChild(sk);
  }
}
function enableRipples(){
  const attach = (el) => {
    if(!el || el.dataset.ripple) return;
    el.dataset.ripple = "1";

    el.addEventListener("click", (e)=>{
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size/2;
      const y = e.clientY - rect.top - size/2;

      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = x + "px";
      ripple.style.top = y + "px";

      // важно: у кнопок уже overflow:hidden
      el.appendChild(ripple);
      setTimeout(()=>ripple.remove(), 650);
    }, { passive:true });
  };

  document.querySelectorAll(".action-btn, .price-btn").forEach(attach);
}

async function fetchUsersFromServer(scope){
  // scope: "all" | "today"
  // Пробуем несколько форматов, чтобы не зависеть от реализации Apps Script:
  // 1) ?action=users&scope=all
  // 2) ?users=1&scope=all
  const urls = [
    `${ANALYTICS_URL}?action=users&scope=${encodeURIComponent(scope)}`,
    `${ANALYTICS_URL}?users=1&scope=${encodeURIComponent(scope)}`
  ];

  for(const url of urls){
    try{
      const r = await fetch(url);
      const j = await r.json();

      // Поддерживаем разные схемы ответа:
      // { users: [{user_id, username}, ...] }
      // { users: { "123":"name", ... } }
      // { all_users: [...]} / { today_users_list: [...] } и т.д.
      let list = null;

      if(Array.isArray(j?.users)) list = j.users;
      else if(j?.users && typeof j.users === "object") {
        list = Object.entries(j.users).map(([id, name]) => ({ user_id: Number(id), username: String(name || "") }));
      }
      else if(Array.isArray(j?.all_users) && scope === "all") list = j.all_users;
      else if(Array.isArray(j?.today_users_list) && scope === "today") list = j.today_users_list;

      if(list){
        // нормализуем
        return list
          .map(u => ({
            user_id: Number(u.user_id ?? u.id ?? 0),
            username: String(u.username ?? u.user ?? u.name ?? "").trim()
          }))
          .filter(u => u.user_id);
      }
    }catch(e){
      // пробуем следующий url
    }
  }
  return null; // сервер не поддерживает
}

function renderUsersList(list, titleText){
  const box = document.getElementById("usersListBox");
  if(!box) return;

  if(!list || list.length === 0){
    box.innerHTML = `<div class="users-empty">Нет данных по пользователям.</div>`;
    return;
  }

  const html = list.slice(0, 200).map(u => `
    <div class="user-row">
      <div class="user-id">${u.user_id}</div>
      <div class="user-name">@${(u.username || "—")}</div>
    </div>
  `).join("");

  box.innerHTML = `
    <div class="users-empty" style="margin-bottom:10px;">${titleText} (показано: ${Math.min(list.length,200)}${list.length>200?" из "+list.length:""})</div>
    <div class="users-list">${html}</div>
  `;
}

async function showUsers(scope){
  const box = document.getElementById("usersListBox");
  if(box) box.innerHTML = `<div class="users-empty">Загрузка списка пользователей…</div>`;

  const list = await fetchUsersFromServer(scope);

  if(list === null){
    // сервер не отдаёт список
    if(box){
      box.innerHTML = `
        <div class="users-empty">
          Серверная аналитика сейчас отдаёт только числа, но не список пользователей.<br><br>
          Нужно добавить в Google Apps Script обработчик <b>action=users</b> (all/today), чтобы возвращать массив:
          <br><br>
          <code>{ users: [{ user_id: 123, username: "name" }, ...] }</code>
        </div>
      `;
    }
    return;
  }

  renderUsersList(list, scope === "today" ? "Новые пользователи сегодня" : "Все уникальные пользователи");
}

function copyUsersToClipboard(){
  const box = document.getElementById("usersListBox");
  if(!box) return;

  // Собираем текст из текущего отображения
  const rows = Array.from(box.querySelectorAll(".user-row")).map(r=>{
    const id = r.querySelector(".user-id")?.textContent?.trim() || "";
    const name = r.querySelector(".user-name")?.textContent?.trim() || "";
    return `${id}\t${name}`;
  }).filter(Boolean);

  if(rows.length === 0) return;

  const text = rows.join("\n");
  navigator.clipboard?.writeText(text).then(()=>{
    haptic("light");
  }).catch(()=>{});
}
